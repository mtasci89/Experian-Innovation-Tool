[build]
  publish = "."
  command = ""

[build.environment]
  # Firebase web apiKey is public-by-design (security is enforced via
  # Firebase Security Rules, not secrecy). Tell Netlify's secrets scanner
  # to ignore this specific key so it doesn't block deploys.
  SECRETS_SCAN_OMIT_KEYS = "AIzaSyCElqzY1j_r7zIOJVDLl1WeKifFKcnuVEg"
  SECRETS_SCAN_OMIT_PATHS = "index.html"
