<script>
  const uuid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  const now  = () => new Date().toISOString();

  const AUTH_KEY    = 'innovation-tool-auth';
  const SESSION_KEY = 'innovation-tool-session';
  const STORAGE_KEY = 'innovation-tool-v3'; // localStorage migration

  // ── Firebase ──────────────────────────────────────────────────────────
  const firebaseConfig = {
    apiKey: "AIzaSyCElqzY1j_r7zIOJVDLl1WeKifFKcnuVEg",
    authDomain: "innovation-tool-1eb65.firebaseapp.com",
    databaseURL: "https://innovation-tool-1eb65-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "innovation-tool-1eb65",
    storageBucket: "innovation-tool-1eb65.firebasestorage.app",
    messagingSenderId: "377015243493",
    appId: "1:377015243493:web:8aad20be5fffd734f8ba0c",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  // Sign every visitor in anonymously so the RTDB security rules can
  // require auth (.read/.write: auth != null). The Firebase SDK queues
  // reads/writes until auth resolves, so we don't need to gate the UI.
  // Errors are logged but non-blocking — the app still loads (it just
  // won't be able to read/write until rules allow anon).
  try {
    firebase.auth().signInAnonymously().catch(e => console.warn('[anon-auth]', e?.message || e));
  } catch (e) { console.warn('[anon-auth-init]', e); }

  const DEFAULT_STAGES = [
    { id: 'problem',    name: 'Problem',      color: '#C1188B', order: 0 },
    { id: 'solution',   name: 'Solution',     color: '#E80070', order: 1 },
    { id: 'feedback',   name: 'Feedback',     color: '#77127B', order: 2 },
    { id: 'test-learn', name: 'Test & Learn', color: '#426DA9', order: 3 },
    { id: 'pilot',      name: 'Pilot',        color: '#1D4F91', order: 4 },
    { id: 'scale',      name: 'Scale',        color: '#122F58', order: 5 },
  ];

  const DEFAULT_CANVAS_TEMPLATES = [
    {
      id: 'experian', name: 'Experian Business Canvas',
      sections: [
        { id: 'jtbd',               name: 'JTBD' },
        { id: 'problem-solution',   name: 'Problem & Solution' },
        { id: 'business-partners',  name: 'Business Partners' },
        { id: 'data-partners',      name: 'Data Partners' },
        { id: 'user-journey',       name: 'User Journey', type: 'journey' },
        { id: 'market-size',       name: 'Market Size' },
        { id: 'experian-strategy', name: 'Experian Strategy Relevance' },
        { id: 'northstar',         name: 'Northstar Feature' },
        { id: 'monetization',      name: 'Monetization' },
      ]
    },
    {
      id: 'bmc', name: 'Business Model Canvas',
      sections: [
        { id: 'key-partners',    name: 'Key Partners' },
        { id: 'key-activities',  name: 'Key Activities' },
        { id: 'value-props',     name: 'Value Propositions' },
        { id: 'customer-rel',    name: 'Customer Relationships' },
        { id: 'customer-seg',    name: 'Customer Segments' },
        { id: 'key-resources',   name: 'Key Resources' },
        { id: 'channels',        name: 'Channels' },
        { id: 'cost-structure',  name: 'Cost Structure' },
        { id: 'revenue-streams', name: 'Revenue Streams' },
      ]
    },
    {
      id: 'lean', name: 'Lean Canvas',
      sections: [
        { id: 'problem',      name: 'Problem' },
        { id: 'solution',     name: 'Solution' },
        { id: 'uvp',          name: 'Unique Value Proposition' },
        { id: 'unfair-adv',   name: 'Unfair Advantage' },
        { id: 'metrics',      name: 'Key Metrics' },
        { id: 'channels',     name: 'Channels' },
        { id: 'customer-seg', name: 'Customer Segments' },
        { id: 'cost-struct',  name: 'Cost Structure' },
        { id: 'revenue',      name: 'Revenue Streams' },
      ]
    },
  ];

  const getInitialState = () =>
    ({ stages: DEFAULT_STAGES, ideas: [], canvasTemplates: DEFAULT_CANVAS_TEMPLATES, tagLibrary: [] });

  // Throttled history pruning — runs at most once per minute per browser
  let __lastHistoryPrune = 0;
  const pruneHistory = () => {
    const now = Date.now();
    if (now - __lastHistoryPrune < 60_000) return;
    __lastHistoryPrune = now;
    try {
      db.ref('appData_history').once('value', snap => {
        const all = snap.val() || {};
        const keys = Object.keys(all).sort(); // push() keys are chronologically sortable
        const KEEP = 100;
        if (keys.length > KEEP) {
          const toDel = keys.slice(0, keys.length - KEEP);
          toDel.forEach(k => db.ref('appData_history/' + k).remove());
        }
      });
    } catch(e) {}
  };

  const saveState = (s) => {
    const stamped = { ...s, updatedAt: Date.now() };
    try { db.ref('appData').set(stamped); } catch (e) {}
    // Append immutable snapshot to history so we can roll back
    try {
      db.ref('appData_history').push({ at: Date.now(), data: stamped });
      pruneHistory();
    } catch (e) {}
    // Daily rolling localStorage backup (keeps last 7 days)
    try {
      const today = new Date().toISOString().slice(0, 10);
      const key = 'innovation-tool-backup-' + today;
      if (!localStorage.getItem(key)) {
        localStorage.setItem(key, JSON.stringify(stamped));
        // prune backups older than 7 days
        const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('innovation-tool-backup-')) {
            const d = k.slice('innovation-tool-backup-'.length);
            const t = Date.parse(d);
            if (!isNaN(t) && t < cutoff) localStorage.removeItem(k);
          }
        });
      }
    } catch (e) {}
  };

  // ── Auth helpers ──────────────────────────────────────────────────────
  const getAuthConfig = () => {
    try {
      const s = localStorage.getItem(AUTH_KEY);
      return s ? JSON.parse(s) : { enabled: false, adminPass: '', viewerPass: '' };
    } catch { return { enabled: false, adminPass: '', viewerPass: '' }; }
  };

  const saveAuthConfig = (cfg) => {
    localStorage.setItem(AUTH_KEY, JSON.stringify(cfg));
  };

  const getSession = () => {
    try {
      const s = sessionStorage.getItem(SESSION_KEY);
      return s ? JSON.parse(s) : null;
    } catch { return null; }
  };

  const setSession = (role) => {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({ role }));
  };

  const clearSession = () => sessionStorage.removeItem(SESSION_KEY);
</script>

<script type="text/babel">
const {
  useState, useEffect, useReducer, useContext, createContext,
  useCallback, useRef,
} = React;

const Ctx = createContext(null);

// ── Reducer ────────────────────────────────────────────────────────────
// Firebase strips null, converts arrays to objects with numeric keys, drops empty arrays.
// This normalizes the data back to the shape the app expects.
function normalizeFirebaseData(data) {
  const toArr = v => {
    if (Array.isArray(v)) return v.filter(x => x != null);
    if (v && typeof v === 'object') return Object.values(v).filter(x => x != null);
    return [];
  };
  const safeObj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};

  if (!data) return { stages: DEFAULT_STAGES, ideas: [], canvasTemplates: DEFAULT_CANVAS_TEMPLATES, tagLibrary: [] };

  return {
    stages: toArr(data.stages).length ? toArr(data.stages) : DEFAULT_STAGES,
    tagLibrary: toArr(data.tagLibrary).filter(t => typeof t === 'string'),
    ideas: toArr(data.ideas).map(idea => ({
      ...idea,
      tags: toArr(idea.tags),
      canvases: toArr(idea.canvases).map(c => ({
        ...c,
        sections: toArr(c.sections).map(sec => {
          // Auto-upgrade: any section named "User Journey" becomes a journey flow section
          const isUserJourney = typeof sec.name === 'string' &&
            sec.name.trim().toLowerCase() === 'user journey';
          if (isUserJourney && sec.type !== 'journey') {
            return { ...sec, type: 'journey', steps: toArr(sec.steps) };
          }
          if (sec.type === 'journey') {
            return { ...sec, steps: toArr(sec.steps) };
          }
          return sec;
        }),
      })),
      stageData: Object.fromEntries(
        Object.entries(safeObj(idea.stageData)).map(([k, v]) => [k, {
          notes: toArr(v && v.notes),
          evaluation: (v && v.evaluation) || null,
        }])
      ),
    })),
    canvasTemplates: (() => {
      const saved = toArr(data.canvasTemplates)
        .map(t => ({ ...t, sections: toArr(t.sections) }))
        .map(t => {
          // One-time migration: rename Partners → Business Partners and add Data Partners
          // in the Experian template, if not already done.
          if (t.id !== 'experian') return t;
          const secIds = new Set(t.sections.map(s => s.id));
          if (secIds.has('partners') && !secIds.has('business-partners') && !secIds.has('data-partners')) {
            const newSecs = [];
            t.sections.forEach(s => {
              if (s.id === 'partners') {
                newSecs.push({ ...s, id: 'business-partners', name: 'Business Partners' });
                newSecs.push({ id: 'data-partners', name: 'Data Partners' });
              } else {
                newSecs.push(s);
              }
            });
            return { ...t, sections: newSecs };
          }
          return t;
        });
      if (saved.length === 0) return DEFAULT_CANVAS_TEMPLATES;
      // Merge: add any default template that's missing from saved (so new defaults
      // like "Experian Business Canvas" show up for existing installs).
      const savedIds = new Set(saved.map(t => t.id));
      const missing = DEFAULT_CANVAS_TEMPLATES.filter(t => !savedIds.has(t.id));
      return missing.length ? [...missing, ...saved] : saved;
    })(),
  };
}

function reducer(state, action) {
  if (action.type === 'SYNC_FROM_FIREBASE') {
    const normalized = normalizeFirebaseData(action.data);
    if (JSON.stringify(state) === JSON.stringify(normalized)) return state;
    return normalized;
  }
  let s;
  switch (action.type) {

    case 'ADD_IDEA': {
      const idea = {
        id: uuid(),
        title: action.title || 'Yeni Fikir',
        tagline: action.tagline || '',
        description: '',
        stageId: action.stageId,
        createdAt: now(), updatedAt: now(),
        owner: '', tags: [], stageData: {}, canvases: [],
      };
      if (action.problemFields)    idea.problemFields    = action.problemFields;
      if (action.submittedBy)      idea.submittedBy      = action.submittedBy;
      if (action.submittedByToken) idea.submittedByToken = action.submittedByToken;
      s = { ...state, ideas: [...state.ideas, idea] };
      break;
    }

    case 'UPDATE_IDEA':
      s = {
        ...state,
        ideas: state.ideas.map(i =>
          i.id === action.id ? { ...i, ...action.updates, updatedAt: now() } : i
        ),
      };
      break;

    case 'MOVE_IDEA':
      s = {
        ...state,
        ideas: state.ideas.map(i =>
          i.id === action.id ? { ...i, stageId: action.stageId, updatedAt: now() } : i
        ),
      };
      break;

    case 'DELETE_IDEA':
      s = { ...state, ideas: state.ideas.filter(i => i.id !== action.id) };
      break;

    case 'ADD_NOTE': {
      s = {
        ...state,
        ideas: state.ideas.map(idea => {
          if (idea.id !== action.ideaId) return idea;
          const sd = idea.stageData[action.stageId] || { notes: [], evaluation: null };
          return {
            ...idea, updatedAt: now(),
            stageData: {
              ...idea.stageData,
              [action.stageId]: {
                ...sd,
                notes: [...(sd.notes || []), {
                  id: uuid(),
                  content: action.content || '',
                  type: action.noteType || 'text',
                  file: action.file || null,
                  createdAt: now(),
                }],
              },
            },
          };
        }),
      };
      break;
    }

    case 'UPDATE_NOTE':
      s = {
        ...state,
        ideas: state.ideas.map(idea => {
          if (idea.id !== action.ideaId) return idea;
          const sd = idea.stageData[action.stageId] || { notes: [] };
          return {
            ...idea, updatedAt: now(),
            stageData: {
              ...idea.stageData,
              [action.stageId]: {
                ...sd,
                notes: (sd.notes || []).map(n =>
                  n.id === action.noteId ? { ...n, content: action.content } : n
                ),
              },
            },
          };
        }),
      };
      break;

    case 'DELETE_NOTE':
      s = {
        ...state,
        ideas: state.ideas.map(idea => {
          if (idea.id !== action.ideaId) return idea;
          const sd = idea.stageData[action.stageId] || { notes: [] };
          return {
            ...idea, updatedAt: now(),
            stageData: {
              ...idea.stageData,
              [action.stageId]: { ...sd, notes: (sd.notes || []).filter(n => n.id !== action.noteId) },
            },
          };
        }),
      };
      break;

    case 'SET_EVALUATION':
      s = {
        ...state,
        ideas: state.ideas.map(idea => {
          if (idea.id !== action.ideaId) return idea;
          const sd = idea.stageData[action.stageId] || { notes: [] };
          return {
            ...idea, updatedAt: now(),
            stageData: {
              ...idea.stageData,
              [action.stageId]: { ...sd, evaluation: { ...action.evaluation, evaluatedAt: now() } },
            },
          };
        }),
      };
      break;

    case 'ADD_CANVAS': {
      const tmpl = action.templateId
        ? state.canvasTemplates.find(t => t.id === action.templateId)
        : null;
      const contentMap = action.contentMap || {};
      const nk = s => (s || '').toLowerCase().replace(/[^a-z0-9ğüşöçı]+/gi, '');
      const canvas = {
        id: uuid(),
        name: action.name || (tmpl ? tmpl.name : 'Yeni Canvas'),
        sections: tmpl
          ? tmpl.sections.map(sec => ({ ...sec, id: uuid(), content: contentMap[nk(sec.name)] || contentMap[sec.name] || '' }))
          : [{ id: uuid(), name: 'Bölüm 1', content: '' }],
        createdAt: now(),
      };
      s = {
        ...state,
        ideas: state.ideas.map(i =>
          i.id === action.ideaId
            ? { ...i, canvases: [...(i.canvases || []), canvas], updatedAt: now() }
            : i
        ),
      };
      break;
    }

    case 'UPDATE_CANVAS':
      s = {
        ...state,
        ideas: state.ideas.map(i =>
          i.id !== action.ideaId ? i : {
            ...i, updatedAt: now(),
            canvases: (i.canvases || []).map(c =>
              c.id === action.canvasId ? { ...c, ...action.updates } : c
            ),
          }
        ),
      };
      break;

    case 'DELETE_CANVAS':
      s = {
        ...state,
        ideas: state.ideas.map(i =>
          i.id !== action.ideaId ? i : {
            ...i, updatedAt: now(),
            canvases: (i.canvases || []).filter(c => c.id !== action.canvasId),
          }
        ),
      };
      break;

    case 'ADD_STAGE': {
      const stage = { id: uuid(), name: action.name, color: action.color || '#6B7280', order: state.stages.length };
      s = { ...state, stages: [...state.stages, stage] };
      break;
    }

    case 'UPDATE_STAGE':
      s = {
        ...state,
        stages: state.stages.map(st => st.id === action.id ? { ...st, ...action.updates } : st),
      };
      break;

    case 'REORDER_STAGES':
      s = { ...state, stages: action.stages.map((st, i) => ({ ...st, order: i })) };
      break;

    case 'SET_TAG_LIBRARY':
      s = { ...state, tagLibrary: action.tags };
      break;

    case 'SET_CANVAS_TEMPLATES':
      s = { ...state, canvasTemplates: action.templates };
      break;

    case 'DELETE_STAGE': {
      const fallback = state.stages.find(st => st.id !== action.id)?.id || state.stages[0]?.id;
      s = {
        ...state,
        stages: state.stages.filter(st => st.id !== action.id),
        ideas: state.ideas.map(i => i.stageId === action.id ? { ...i, stageId: fallback } : i),
      };
      break;
    }

    default: return state;
  }
  saveState(s);
  return s;
}

// ── Shared UI ──────────────────────────────────────────────────────────
// Experian-aligned palette (deck colors first, neutrals last).
const PALETTE = [
  '#C1188B', '#E80070', '#77127B',
  '#426DA9', '#1D4F91', '#173F75', '#122F58',
  '#495765', '#8F97A0',
];
// Color sequence applied by 'Experian renklerini uygula' in settings —
// matches the natural pipeline progression (warm focus → cool delivery).
const EXPERIAN_STAGE_PALETTE = [
  '#77127B', '#C1188B', '#E80070',
  '#426DA9', '#1D4F91', '#173F75', '#122F58',
];

function ColorPicker({ value, onChange }) {
  return (
    <div className="flex flex-wrap gap-2">
      {PALETTE.map(c => (
        <button key={c} onClick={() => onChange(c)}
          className={`w-7 h-7 rounded-full border-2 transition-transform hover:scale-110 ${
            value === c ? 'border-slate-800 scale-110' : 'border-white shadow'
          }`}
          style={{ background: c }} />
      ))}
    </div>
  );
}

// Auto-grow textarea: expands to fit content (no scrollbar, no clipping).
function AutoGrowTextarea({ value, onChange, readOnly, placeholder, className, minRows = 3 }) {
  const ref = useRef(null);
  const resize = () => {
    const el = ref.current;
    if (!el) return;
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  };
  useEffect(() => { resize(); }, [value]);
  return (
    <textarea
      ref={ref}
      value={value || ''}
      rows={minRows}
      onChange={e => { onChange && onChange(e); resize(); }}
      onInput={resize}
      readOnly={readOnly}
      placeholder={placeholder}
      className={className}
      style={{ overflow: 'hidden' }}
    />
  );
}

function TagInput({ tags, onChange }) {
  const [val, setVal] = useState('');
  const add = e => {
    if ((e.key === 'Enter' || e.key === ',') && val.trim()) {
      e.preventDefault();
      if (!tags.includes(val.trim())) onChange([...tags, val.trim()]);
      setVal('');
    }
  };
  return (
    <div className="flex flex-wrap gap-1 p-2 border border-slate-200 rounded-lg min-h-[38px]">
      {tags.map(t => (
        <span key={t} className="flex items-center gap-1 bg-slate-100 text-slate-700 text-xs px-2 py-0.5 rounded-full">
          {t}
          <button onClick={() => onChange(tags.filter(x => x !== t))} className="hover:text-red-500 leading-none">&times;</button>
        </span>
      ))}
      <input value={val} onChange={e => setVal(e.target.value)} onKeyDown={add}
        placeholder="Tag ekle + Enter"
        className="outline-none text-sm flex-1 min-w-[100px] bg-transparent" />
    </div>
  );
}

function Modal({ isOpen, onClose, title, children, size = 'lg' }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape' && onClose) onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);
  if (!isOpen) return null;
  const W = { sm: 'max-w-md', md: 'max-w-xl', lg: 'max-w-3xl', xl: 'max-w-6xl' }[size] || 'max-w-3xl';
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center pt-6 pb-6 px-4 overflow-y-auto"
         style={{ background: 'rgba(15,23,42,0.6)' }}
         onClick={e => e.target === e.currentTarget && onClose && onClose()}>
      <div className={`bg-white rounded-2xl shadow-2xl w-full ${W} my-auto`}>
        {title != null && (
          <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
            <h2 className="text-base font-semibold text-slate-800">{title}</h2>
            {onClose && <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>}
          </div>
        )}
        <div className="overflow-y-auto" style={{ maxHeight: '88vh' }}>
          {children}
        </div>
      </div>
    </div>
  );
}

function FileAttachmentDisplay({ file, onDelete, canEdit }) {
  const ext = file.name.split('.').pop().toLowerCase();
  const isImage = ['jpg','jpeg','png','gif','webp','svg'].includes(ext);

  const download = () => {
    const a = document.createElement('a');
    a.href = file.dataUrl;
    a.download = file.name;
    a.click();
  };

  return (
    <div className="border border-slate-200 rounded-xl p-3 bg-white flex items-start gap-3 mt-2">
      {isImage ? (
        <img src={file.dataUrl} alt={file.name}
          className="w-16 h-16 object-cover rounded-lg flex-shrink-0 border border-slate-100" />
      ) : (
        <div className="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center flex-shrink-0">

      <div className="flex-1 min-w-0">
        <p className="text-sm font-medium text-slate-700 truncate">{file.name}</p>
        <p className="text-xs text-slate-400">{(file.size / 1024).toFixed(1)} KB</p>
      </div>
      <div className="flex gap-1 flex-shrink-0">
        <button onClick={download}
          className="text-xs px-2.5 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg hover:bg-indigo-100 font-medium">

  const [pendingFile, setPendingFile] = useState(null);

  const [editId, setEditId] = useState(null);
  const [editContent, setEditContent] = useState('');

  const stageById = id => (state.stages || []).find(s => s.id === id);

// ── Journey flow (horizontal step boxes with arrows) ──────────────────
function JourneyFlow({ steps, canEdit, onChange }) {
  const list = Array.isArray(steps) ? steps : [];
  const [dragId, setDragId] = useState(null);

  const update = (id, patch) =>
    onChange(list.map(s => s.id === id ? { ...s, ...patch } : s));
  const remove = (id) => onChange(list.filter(s => s.id !== id));
  const addStep = () =>
    onChange([...list, { id: 'step-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), title: '', description: '' }]);
  const reorder = (fromId, toId) => {
    if (!fromId || !toId || fromId === toId) return;
    const next = [...list];
    const fi = next.findIndex(s => s.id === fromId);
    const ti = next.findIndex(s => s.id === toId);
    if (fi < 0 || ti < 0) return;
    const [moved] = next.splice(fi, 1);
    next.splice(ti, 0, moved);
    onChange(next);
  };

  if (list.length === 0 && !canEdit) {
    return <div className="text-sm text-slate-400 italic">Henüz adım eklenmemiş</div>;
  }

  return (
    <div className="w-full">
      <div className="flex flex-wrap items-stretch gap-2">
        {list.map((step, idx) => (
          <React.Fragment key={step.id}>
            <div
              draggable={canEdit}
              onDragStart={canEdit ? (e) => { setDragId(step.id); e.dataTransfer.setData('journey-step', step.id); e.dataTransfer.effectAllowed = 'move'; } : undefined}
              onDragOver={canEdit ? (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; } : undefined}
              onDrop={canEdit ? (e) => { e.preventDefault(); const from = e.dataTransfer.getData('journey-step') || dragId; reorder(from, step.id); setDragId(null); } : undefined}
              onDragEnd={() => setDragId(null)}
              className={`relative flex-1 min-w-[140px] max-w-[220px] bg-white border border-experian-blue/20 rounded-lg shadow-sm overflow-hidden ${canEdit ? 'cursor-move hover:border-experian-blue hover:shadow-md transition-all' : ''} ${dragId === step.id ? 'opacity-50' : ''}`}
            >
              {/* Brand header strip on each step */}
              <div className="h-1 w-full bg-gradient-to-r from-experian-blue to-experian-purple"></div>
              <div className="p-2">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-[10px] font-bold text-white bg-experian-blue rounded-full w-5 h-5 flex items-center justify-center shadow-sm">
                    {idx + 1}
                  </span>
                  {canEdit && (
                    <button onClick={() => remove(step.id)}
                      className="text-slate-300 hover:text-red-500 text-sm leading-none">&times;</button>
                  )}
                </div>
                <input
                  value={step.title || ''}
                  onChange={e => canEdit && update(step.id, { title: e.target.value })}
                  readOnly={!canEdit}
                  placeholder={canEdit ? 'Adım başlığı' : '—'}
                  className="w-full text-sm font-semibold text-experian-blue outline-none bg-transparent mb-1"
                />
                <textarea
                  value={step.description || ''}
                  onChange={e => canEdit && update(step.id, { description: e.target.value })}
                  readOnly={!canEdit}
                  placeholder={canEdit ? 'Açıklama…' : ''}
                  rows={5}
                  className="w-full text-xs text-slate-600 outline-none bg-transparent resize-none"
                />
              </div>
            </div>
            {idx < list.length - 1 && (
              <div className="flex items-center text-experian-magenta text-2xl font-bold select-none">›</div>
            )}
          </React.Fragment>
        ))}
        {canEdit && (
          <button onClick={addStep}
            className="min-w-[100px] border-2 border-dashed border-experian-blue/40 text-experian-blue rounded-lg hover:bg-experian-blue/5 hover:border-experian-blue text-sm font-medium px-3 py-2 transition-colors">
            + Adım
          </button>
        )}
      </div>
    </div>
  );
}

// ── Canvas importers (PPTX / DOCX) ─────────────────────────────────────
const decodeXmlEntities = (s) =>
  (s || '').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
           .replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&apos;/g, "'");

// Heuristic: does text look like a slide footer / page number / confidentiality stamp?
const isFooterText = (t) => {
  if (!t) return false;
  const trim = t.trim();
  if (/\b(Gizli|Konsept|Confidential|Proprietary|©|Copyright|All rights reserved)\b/i.test(trim)) return true;
  if (/^\d{4}$/.test(trim)) return true;             // year only
  if (/^\d{1,3}$/.test(trim.replace(/\s+/g, ''))) return true; // page number
  if (/^\d+\s*\/\s*\d+$/.test(trim)) return true;    // "3 / 10"
  return false;
};

// Parse each shape/text-box as a block with {title, body, x, y, cx, cy}.
// Handles canvas-style decks where every section is its own text box on a single slide.
async function parsePptxSections(file) {
  if (!window.JSZip) throw new Error('JSZip yüklenemedi, sayfayı yenileyin');
  const zip = await window.JSZip.loadAsync(file);

  // Read slide dimensions (EMUs) for footer / position filtering.
  let slideCx = 12192000, slideCy = 6858000; // widescreen default
  try {
    const presFile = zip.file('ppt/presentation.xml');
    if (presFile) {
      const presXml = await presFile.async('text');
      const sldSz = presXml.match(/<p:sldSz\s+cx="(\d+)"\s+cy="(\d+)"/);
      if (sldSz) { slideCx = +sldSz[1]; slideCy = +sldSz[2]; }
    }
  } catch {}

  const slideNames = Object.keys(zip.files)
    .filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n))
    .sort((a, b) => {
      const ai = parseInt(a.match(/slide(\d+)/)[1], 10);
      const bi = parseInt(b.match(/slide(\d+)/)[1], 10);
      return ai - bi;
    });

  const allBlocks = [];
  for (const name of slideNames) {
    const xml = await zip.file(name).async('text');
    const spRegex = /<(p:sp|a:tc)\b[\s\S]*?<\/\1>/g;
    let m;
    while ((m = spRegex.exec(xml)) !== null) {
      const sp = m[0];
      const txBodyMatch = sp.match(/<(a:txBody|p:txBody)\b[\s\S]*?<\/\1>/);
      if (!txBodyMatch) continue;
      const txBody = txBodyMatch[0];

      const paraRegex = /<a:p\b[^>]*>([\s\S]*?)<\/a:p>/g;
      const paras = [];
      let p;
      while ((p = paraRegex.exec(txBody)) !== null) {
        const runs = [...p[1].matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)]
          .map(r => decodeXmlEntities(r[1]));
        const text = runs.join('').trim();
        if (text) paras.push(text);
      }
      if (!paras.length) continue;

      // Position (EMUs)
      const offMatch  = sp.match(/<a:off\s+x="(-?\d+)"\s+y="(-?\d+)"/);
      const extMatch  = sp.match(/<a:ext\s+cx="(\d+)"\s+cy="(\d+)"/);
      const x  = offMatch ? +offMatch[1] : 0;
      const y  = offMatch ? +offMatch[2] : 0;
      const cx = extMatch ? +extMatch[1] : 0;
      const cy = extMatch ? +extMatch[2] : 0;

      const allText = paras.join('\n');

      // ── Footer filter ──
      // Skip if text matches footer patterns.
      if (isFooterText(allText)) continue;
      // Skip short-ish text in the bottom 10% of slide (classic footer band).
      if (slideCy > 0 && (y + cy) > slideCy * 0.90 && allText.length < 180) continue;

      allBlocks.push({
        title: paras[0],
        body: paras.slice(1).join('\n'),
        allText,
        paras,
        x, y, cx, cy,
        cx_mid: x + cx / 2,
        cy_mid: y + cy / 2,
        slideCx, slideCy,
      });
    }
  }
  return allBlocks;
}

async function parseDocxSections(file) {
  if (!window.JSZip) throw new Error('JSZip yüklenemedi, sayfayı yenileyin');
  const zip = await window.JSZip.loadAsync(file);
  const docFile = zip.file('word/document.xml');
  if (!docFile) throw new Error('Geçersiz docx (document.xml bulunamadı)');
  const xml = await docFile.async('text');
  const paraRegex = /<w:p\b[^>]*>([\s\S]*?)<\/w:p>/g;
  const sections = [];
  let cur = null;
  let m;
  while ((m = paraRegex.exec(xml)) !== null) {
    const inner = m[1];
    const style = (inner.match(/<w:pStyle\s+w:val="([^"]+)"/) || [])[1] || '';
    const text = [...inner.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)]
      .map(r => decodeXmlEntities(r[1])).join('').trim();
    if (!text) continue;
    const isHeading = /^(Heading|Title)/i.test(style);
    if (isHeading) {
      if (cur) sections.push(cur);
      cur = { title: text, body: '' };
    } else if (cur) {
      cur.body += (cur.body ? '\n' : '') + text;
    } else {
      // Text before any heading — treat the first line as implicit title
      cur = { title: text, body: '' };
    }
  }
  if (cur) sections.push(cur);
  // Add fields that buildContentMap expects (positions unused for docx)
  return sections.map((s, i) => ({
    ...s,
    allText: s.title + (s.body ? '\n' + s.body : ''),
    x: 0, y: i, cx: 0, cy: 1,
    cx_mid: 0, cy_mid: i,
  }));
}

// Alphanumeric-only lowercase normalization (tolerant of punctuation/spacing/case)
const normKey = s => (s || '').toLowerCase().replace(/[^a-z0-9ğüşöçı]+/gi, '');

// Does a block's first line/title contain this section name (normalized)?
function blockMatchesSection(block, secName) {
  if (!block) return false;
  const sKey = normKey(secName);
  if (!sKey) return false;
  const titleKey = normKey(block.title);
  if (!titleKey) return false;
  // Exact match OR section-key appears as substring in the title line
  return titleKey === sKey || titleKey.includes(sKey) || sKey.includes(titleKey);
}

// Score each template by how many sections have at least one matching block.
function matchTemplate(blocks, templates) {
  let best = null; let bestScore = 0;
  for (const t of templates) {
    let score = 0;
    for (const sec of (t.sections || [])) {
      if (blocks.some(b => blockMatchesSection(b, sec.name))) score++;
    }
    if (score > bestScore) { bestScore = score; best = t; }
  }
  return { template: best, score: bestScore };
}

// Build a map of section-name-key → content text.
// Strategy:
//   1. For each section, find label block(s) whose title matches the section name.
//   2. Identify "orphan" blocks (non-label, with real textual content).
//   3. Each orphan is assigned to the nearest section label — prioritising
//      spatial containment (same column/row), then Euclidean distance.
//   4. Final content = label's own body paragraphs + assigned orphans' text.
function buildContentMap(blocks, template) {
  const sections = template.sections || [];
  const map = {};

  // Label blocks (may be multiple for one section, rare)
  const sectionLabels = {}; // sKey -> [blocks]
  for (const sec of sections) {
    const sKey = normKey(sec.name);
    sectionLabels[sKey] = blocks.filter(b => blockMatchesSection(b, sec.name));
  }
  const labelBlockSet = new Set([].concat(...Object.values(sectionLabels)));

  // Orphan = not a section label AND has meaningful textual content.
  // Filters out decorations, numbered badges ("1", "6"), tiny symbols.
  const orphans = blocks.filter(b => {
    if (labelBlockSet.has(b)) return false;
    const compact = (b.allText || '').replace(/\s+/g, '');
    if (compact.length < 5) return false;
    const alpha = compact.replace(/[^a-zA-ZğüşöçıİĞÜŞÖÇ]/g, '');
    return alpha.length >= 3; // at least 3 alphabetic chars
  });

  // Score how well an orphan "belongs" to a given label.
  // Lower score = better match. Prefer:
  //   - overlapping bounding box (orphan center inside or near label's region)
  //   - same horizontal column + below label
  //   - smallest Euclidean distance
  const scoreFor = (orphan, label) => {
    const dx = orphan.cx_mid - label.cx_mid;
    const dy = orphan.cy_mid - label.cy_mid;
    const halfW = (label.cx + orphan.cx) / 2;
    const halfH = (label.cy + orphan.cy) / 2;
    const horizontalOverlap = Math.abs(dx) < halfW * 1.1;
    const verticalOverlap   = Math.abs(dy) < halfH * 1.1;
    const isBelow = orphan.y > label.y;
    let score = Math.sqrt(dx * dx + dy * dy);
    if (horizontalOverlap && verticalOverlap) score -= 1e10;        // bbox overlap
    else if (horizontalOverlap && isBelow)    score -= 5e9;         // below in same column
    else if (horizontalOverlap)               score -= 1e9;         // same column
    return score;
  };

  // Assign each orphan to its closest section label.
  const assignments = {}; // sKey -> [content strings]
  for (const orphan of orphans) {
    let bestKey = null;
    let bestScore = Infinity;
    for (const sec of sections) {
      const sKey = normKey(sec.name);
      const labels = sectionLabels[sKey] || [];
      for (const label of labels) {
        const s = scoreFor(orphan, label);
        if (s < bestScore) { bestScore = s; bestKey = sKey; }
      }
    }
    if (bestKey) {
      if (!assignments[bestKey]) assignments[bestKey] = [];
      assignments[bestKey].push(orphan.allText.trim());
    }
  }

  // Compose final content per section: label's own body + assigned orphans.
  for (const sec of sections) {
    const sKey = normKey(sec.name);
    const labels = sectionLabels[sKey] || [];
    if (!labels.length) continue;
    const parts = [];
    for (const l of labels) {
      const b = (l.body || '').trim();
      if (b) parts.push(b);
    }
    if (assignments[sKey]) parts.push(...assignments[sKey]);
    if (parts.length) map[sKey] = parts.join('\n').trim();
  }
  return map;
}

// ── Canvas editor ──────────────────────────────────────────────────────
function CanvasEditor({ idea, canEdit }) {
  const { state, dispatch } = useContext(Ctx);
  const [activeId, setActiveId] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [cName, setCName] = useState('');
  const [cTmpl, setCTmpl] = useState('');
  const [addingSec, setAddingSec] = useState(false);
  const [secName, setSecName] = useState('');
  const [lightbox, setLightbox] = useState(null);
  const [editingNameId, setEditingNameId] = useState(null);
  const [editingNameVal, setEditingNameVal] = useState('');
  const [dragSecId, setDragSecId] = useState(null);

  const canvases = idea.canvases || [];
  const active = canvases.find(c => c.id === activeId) || canvases[0] || null;

  const createCanvas = () => {
    if (!cName.trim()) return;
    dispatch({ type: 'ADD_CANVAS', ideaId: idea.id, name: cName.trim(), templateId: cTmpl || null });
    setCName(''); setCTmpl(''); setShowAdd(false);
  };

  const importFromFile = async (file) => {
    if (!file) return;
    try {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      let blocks = [];
      if (ext === 'pptx') blocks = await parsePptxSections(file);
      else if (ext === 'docx') blocks = await parseDocxSections(file);
      else { alert('Sadece .pptx veya .docx dosyaları desteklenir'); return; }

      if (!blocks.length) { alert('Dosyada metin içerik bulunamadı'); return; }

      const { template, score } = matchTemplate(blocks, state.canvasTemplates || []);
      if (!template || score === 0) {
        const preview = blocks.map(b => '• ' + (b.title || '').slice(0, 60)).join('\n').slice(0, 800);
        alert(`Hiçbir şablonun bölüm adlarıyla eşleşme bulunamadı.\n\nDosyada bulunan metin kutuları:\n${preview}`);
        return;
      }

      const contentMap = buildContentMap(blocks, template);
      const filledCount = Object.keys(contentMap).length;

      if (!confirm(
        `"${template.name}" şablonu seçildi. ${filledCount}/${(template.sections || []).length} bölüm içerik aldı.\n\n` +
        `Canvas oluşturulsun mu?`
      )) return;

      dispatch({
        type: 'ADD_CANVAS',
        ideaId: idea.id,
        name: `${template.name} (import)`,
        templateId: template.id,
        contentMap,
      });
    } catch (err) {
      console.error(err);
      alert('Dosya okunamadı: ' + (err.message || err));
    }
  };

  const patchSection = (secId, patch) => {
    if (!active) return;
    dispatch({
      type: 'UPDATE_CANVAS', ideaId: idea.id, canvasId: active.id,
      updates: { sections: active.sections.map(s => s.id === secId ? { ...s, ...patch } : s) },
    });
  };

  const updateSection      = (_, secId, content) => patchSection(secId, { content });
  const updateSectionImage = (_, secId, image)   => patchSection(secId, { image });
  const updateSectionName  = (secId, name)        => patchSection(secId, { name });

  const toggleJourney = (secId) => {
    const sec = active?.sections.find(s => s.id === secId);
    if (!sec) return;
    const isJourney = sec.type === 'journey';
    patchSection(secId, {
      type: isJourney ? 'text' : 'journey',
      steps: isJourney ? undefined : (sec.steps || []),
    });
  };

  const updateJourneySteps = (secId, steps) => patchSection(secId, { steps });

  const addSection = () => {
    if (!active || !secName.trim()) return;
    dispatch({
      type: 'UPDATE_CANVAS', ideaId: idea.id, canvasId: active.id,
      updates: { sections: [...active.sections, { id: uuid(), name: secName.trim(), content: '' }] },
    });
    setSecName(''); setAddingSec(false);
  };

  const deleteSection = (secId) => {
    if (!active) return;
    dispatch({
      type: 'UPDATE_CANVAS', ideaId: idea.id, canvasId: active.id,
      updates: { sections: active.sections.filter(s => s.id !== secId) },
    });
  };

  const reorderSections = (fromId, toId) => {
    if (!active || fromId === toId) return;
    const list = [...active.sections];
    const fromIdx = list.findIndex(s => s.id === fromId);
    const toIdx   = list.findIndex(s => s.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;
    const [moved] = list.splice(fromIdx, 1);
    list.splice(toIdx, 0, moved);
    dispatch({
      type: 'UPDATE_CANVAS', ideaId: idea.id, canvasId: active.id,
      updates: { sections: list },
    });
  };

  const commitEditName = () => {
    if (editingNameId && editingNameVal.trim()) {
      updateSectionName(editingNameId, editingNameVal.trim());
    }
    setEditingNameId(null); setEditingNameVal('');
  };

  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-4">
        {canvases.map(c => (
          <button key={c.id} onClick={() => setActiveId(c.id)}
            className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
              active?.id === c.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }`}>
            {c.name}
          </button>
        ))}
        {canEdit && (
          <button onClick={() => setShowAdd(!showAdd)}
            className="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 hover:bg-emerald-100">
            + Canvas Ekle
          </button>
        )}
        {canEdit && (
          <label className="px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700 hover:bg-indigo-100 cursor-pointer"
            title="Bölüm başlıkları şablonla eşleşen .pptx veya .docx dosyasından canvas oluştur">
            📂 Dosyadan İçe Aktar
            <input type="file" accept=".pptx,.docx" className="hidden"
              onChange={e => { const f = e.target.files?.[0]; e.target.value = ''; importFromFile(f); }} />
          </label>
        )}
      </div>

      {showAdd && canEdit && (
        <div className="bg-slate-50 rounded-xl p-4 mb-4 border border-slate-200 space-y-2">
          <div className="flex gap-2">
            <input value={cName} onChange={e => setCName(e.target.value)} placeholder="Canvas adı"
              className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-300" />
            <select value={cTmpl} onChange={e => setCTmpl(e.target.value)}
              className="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white">
              <option value="">Şablonsuz</option>
              {state.canvasTemplates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
            </select>
          </div>
          <div className="flex gap-2">
            <button onClick={createCanvas}
              className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">Oluştur</button>
            <button onClick={() => setShowAdd(false)}
              className="px-4 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-sm">İptal</button>
          </div>
        </div>
      )}

      {active ? (
        <div>
          <div className="flex items-center justify-between mb-3">
            <h4 className="font-semibold text-slate-700">{active.name}</h4>
            {canEdit && (
              <div className="flex gap-2">
                <button onClick={() => setAddingSec(true)}
                  className="text-xs px-3 py-1 bg-slate-100 rounded-lg hover:bg-slate-200 text-slate-600">
                  + Bölüm Ekle
                </button>
                <button onClick={() => {
                  if (confirm('Bu canvası silmek istiyor musunuz?')) {
                    dispatch({ type: 'DELETE_CANVAS', ideaId: idea.id, canvasId: active.id });
                    setActiveId(null);
                  }
                }} className="text-xs px-3 py-1 bg-red-50 rounded-lg hover:bg-red-100 text-red-600">Sil</button>
              </div>
            )}
          </div>

          {addingSec && canEdit && (
            <div className="flex gap-2 mb-3">
              <input value={secName} onChange={e => setSecName(e.target.value)}
                placeholder="Bölüm adı" autoFocus onKeyDown={e => e.key === 'Enter' && addSection()}
                className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-300" />
              <button onClick={addSection} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm">Ekle</button>
              <button onClick={() => setAddingSec(false)} className="px-4 py-2 bg-slate-200 rounded-lg text-sm">İptal</button>
            </div>
          )}

          <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
            {active.sections.map(sec => {
              const isJourney = sec.type === 'journey';
              const spanFull = isJourney ? 'col-span-2 md:col-span-3' : '';
              const isDragOver = dragSecId && dragSecId !== sec.id;
              return (
              <div key={sec.id}
                draggable={canEdit && editingNameId !== sec.id}
                onDragStart={e => {
                  if (!canEdit || editingNameId === sec.id) { e.preventDefault(); return; }
                  e.dataTransfer.setData('sec-id', sec.id);
                  e.dataTransfer.effectAllowed = 'move';
                  setDragSecId(sec.id);
                }}
                onDragEnd={() => setDragSecId(null)}
                onDragOver={e => { if (canEdit) e.preventDefault(); }}
                onDrop={e => {
                  if (!canEdit) return;
                  e.preventDefault();
                  const from = e.dataTransfer.getData('sec-id');
                  if (from) reorderSections(from, sec.id);
                  setDragSecId(null);
                }}
                className={`border rounded-xl p-3 bg-white transition-colors group ${spanFull} ${
                  isDragOver ? 'border-indigo-400 border-dashed bg-indigo-50/30' : 'border-slate-200 hover:border-indigo-300'
                }`}>
                <div className="flex items-center justify-between mb-1.5 gap-2">
                  <div className="flex items-center gap-1.5 flex-1 min-w-0">
                    {canEdit && (
                      <span className="text-slate-300 cursor-grab select-none text-sm" title="Sürükleyip sırasını değiştir">⠿</span>
                    )}
                    {editingNameId === sec.id ? (
                      <input
                        autoFocus value={editingNameVal}
                        onChange={e => setEditingNameVal(e.target.value)}
                        onBlur={commitEditName}
                        onKeyDown={e => {
                          if (e.key === 'Enter') { e.preventDefault(); commitEditName(); }
                          if (e.key === 'Escape') { setEditingNameId(null); setEditingNameVal(''); }
                        }}
                        className="text-xs font-semibold tracking-wide border-b border-indigo-400 outline-none flex-1 text-slate-700 bg-transparent" />
                    ) : (
                      <span
                        onClick={() => canEdit && (setEditingNameId(sec.id), setEditingNameVal(sec.name))}
                        title={canEdit ? 'Adı düzenlemek için tıkla' : ''}
                        className={`text-xs font-semibold text-slate-500 tracking-wide truncate ${canEdit ? 'cursor-text hover:text-indigo-600' : ''}`}>
                        {(sec.name || '').toUpperCase()}
                      </span>
                    )}
                  </div>
                  {canEdit && (
                    <div className="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                      <button onClick={() => toggleJourney(sec.id)}
                        title={isJourney ? 'Düz metne çevir' : 'User Journey akışına çevir'}
                        className={`text-xs px-1.5 py-0.5 rounded ${isJourney ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:text-indigo-500'}`}>
                        {isJourney ? '🛣️' : '🛣️'}
                      </button>
                      <button onClick={() => deleteSection(sec.id)}
                        className="text-slate-300 hover:text-red-400 text-lg leading-none">&times;</button>
                    </div>
                  )}
                </div>

                {isJourney ? (
                  <JourneyFlow
                    steps={sec.steps || []}
                    canEdit={canEdit}
                    onChange={steps => updateJourneySteps(sec.id, steps)}
                  />
                ) : (
                  <>
                    <AutoGrowTextarea value={sec.content || ''}
                      onChange={e => canEdit && updateSection(active.id, sec.id, e.target.value)}
                      readOnly={!canEdit}
                      placeholder={canEdit ? 'İçerik girin…' : '—'}
                      minRows={4}
                      className="w-full text-sm text-slate-700 resize-none outline-none bg-transparent min-h-[100px]" />
                    {sec.image && (
                      <div className="mt-2 relative group/img">
                        <img src={sec.image} alt="" onClick={() => setLightbox(sec.image)}
                          className="w-full rounded-lg object-cover max-h-40 border border-slate-100 cursor-zoom-in hover:opacity-90 transition-opacity" />
                        {canEdit && (
                          <button onClick={() => updateSectionImage(active.id, sec.id, null)}
                            className="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-opacity">×</button>
                        )}
                      </div>
                    )}
                    {canEdit && (
                      <label className="mt-2 cursor-pointer flex items-center gap-1 text-xs text-slate-400 hover:text-indigo-500 transition-colors">
                        🖼️ {sec.image ? 'Görseli değiştir' : 'Görsel ekle'}
                        <input type="file" accept="image/*" className="hidden" onChange={e => {
                          const file = e.target.files[0];
                          if (!file) return;
                          if (file.size > 3 * 1024 * 1024) { alert('Maksimum 3MB'); return; }
                          const reader = new FileReader();
                          reader.onload = ev => updateSectionImage(active.id, sec.id, ev.target.result);
                          reader.readAsDataURL(file);
                          e.target.value = '';
                        }} />
                      </label>
                    )}
                  </>
                )}
              </div>
            );})}
          </div>
        </div>
      ) : (
        <div className="text-center py-16 text-slate-400">
          <p className="text-5xl mb-3">🗂️</p>
          <p className="font-medium">Henüz canvas eklenmemiş</p>
          {canEdit && <p className="text-sm mt-1">Yukarıdan "Canvas Ekle" butonunu kullanın</p>}
        </div>
      )}

      {/* Lightbox */}
      {lightbox && (
        <div className="fixed inset-0 z-[999] bg-black/90 flex items-center justify-center p-4"
             onClick={() => setLightbox(null)}>
          <button onClick={() => setLightbox(null)}
            className="absolute top-4 right-5 text-white text-4xl leading-none hover:text-slate-300">&times;</button>
          <img src={lightbox} alt="" onClick={e => e.stopPropagation()}
            className="max-w-full max-h-[90vh] rounded-xl shadow-2xl object-contain" />
        </div>
      )}
    </div>
  );
}

// ── Evaluation panel ───────────────────────────────────────────────────
const EVAL_OPTIONS = [
  { id: 'approved', label: '✅ Onaylandı', bg: 'bg-green-100', border: 'border-green-400', text: 'text-green-700' },
  { id: 'on-hold',  label: '⏸️ Beklemede', bg: 'bg-amber-100', border: 'border-amber-400', text: 'text-amber-700' },
  { id: 'rejected', label: '❌ Reddedildi', bg: 'bg-red-100',   border: 'border-red-400',   text: 'text-red-700'   },
];

function EvaluationPanel({ idea, stageId, canEdit }) {
  const { state, dispatch } = useContext(Ctx);
  const ev = idea.stageData?.[stageId]?.evaluation || {};
  const [result, setResult]     = useState(ev.result || '');
  const [summary, setSummary]   = useState(ev.summary || '');
  const [nextSteps, setNextSteps] = useState(ev.nextSteps || '');
  const [autoMoved, setAutoMoved] = useState('');

  useEffect(() => {
    const e = idea.stageData?.[stageId]?.evaluation || {};
    setResult(e.result || ''); setSummary(e.summary || ''); setNextSteps(e.nextSteps || '');
  }, [stageId, idea.id]);

  const autoMove = (selectedResult) => {
    const nameMap = {
      'on-hold':  s => s.name.toLowerCase().includes('waitlist') || s.name.toLowerCase().includes('bekleme'),
      'rejected': s => s.name.toLowerCase().includes('rejected') || s.name.toLowerCase().includes('reddedildi'),
    };
    const matcher = nameMap[selectedResult];
    if (!matcher) return;
    const target = [...state.stages].reverse().find(matcher);
    if (target && target.id !== idea.stageId) {
      dispatch({ type: 'MOVE_IDEA', id: idea.id, stageId: target.id });
      setAutoMoved(`"${target.name}" adımına taşındı`);
      setTimeout(() => setAutoMoved(''), 3000);
    }
  };

  const save = () => {
    dispatch({ type: 'SET_EVALUATION', ideaId: idea.id, stageId, evaluation: { result, summary, nextSteps } });
  };

  return (
    <div className="space-y-5">
      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-2">Değerlendirme Sonucu</label>
        <div className="flex gap-3">
          {EVAL_OPTIONS.map(o => (
            <button key={o.id}
              onClick={() => {
                if (!canEdit) return;
                setResult(o.id);
                autoMove(o.id);
              }}
              className={`flex-1 py-3 px-3 rounded-xl border-2 text-sm font-medium transition-all ${
                result === o.id ? `${o.bg} ${o.border} ${o.text}` : 'bg-white border-slate-200 text-slate-500'
              } ${canEdit ? 'hover:border-slate-300 cursor-pointer' : 'cursor-default'}`}>
              {o.label}
            </button>
          ))}
        </div>
      </div>

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1">Değerlendirme Özeti</label>
        <textarea value={summary} onChange={e => canEdit && setSummary(e.target.value)} rows={3}
          readOnly={!canEdit}
          placeholder={canEdit ? 'Bu adımda ne değerlendirildi, neler öğrenildi?' : '—'}
          className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm resize-none focus:outline-none focus:border-indigo-300" />
      </div>

      <div>
        <label className="block text-sm font-semibold text-slate-700 mb-1">Sonraki Adımlar</label>
        <textarea value={nextSteps} onChange={e => canEdit && setNextSteps(e.target.value)} rows={3}
          readOnly={!canEdit}
          placeholder={canEdit ? 'Bir sonraki adımda ne yapılacak?' : '—'}
          className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm resize-none focus:outline-none focus:border-indigo-300" />
      </div>

      {canEdit && (
        <button onClick={save}
          className="w-full py-3 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors">
          Değerlendirmeyi Kaydet
        </button>
      )}

      {autoMoved && (
        <div className="bg-amber-50 border border-amber-200 text-amber-700 text-sm px-4 py-2.5 rounded-xl text-center">
          🔀 {autoMoved}
        </div>
      )}

      {ev.evaluatedAt && (
        <p className="text-xs text-center text-slate-400">
          Son güncelleme: {new Date(ev.evaluatedAt).toLocaleDateString('tr-TR', {
            day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit',
          })}
        </p>
      )}
    </div>
  );
}

// ── Next Step panel ────────────────────────────────────────────────────
function NextStepPanel({ idea, canEdit }) {
  const { dispatch } = useContext(Ctx);
  const [val, setVal] = useState(idea.nextStep || '');
  const [saved, setSaved] = useState(false);

  useEffect(() => { setVal(idea.nextStep || ''); }, [idea.id, idea.nextStep]);

  const save = () => {
    dispatch({ type: 'UPDATE_IDEA', id: idea.id, updates: { nextStep: val } });
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  return (
    <div className="space-y-3">
      <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-sm text-indigo-800">
        <b>➡️ Next Step</b> — bu projenin bir sonraki somut adımını buraya yazın. Ekip için tek bir odak noktası.
      </div>
      <AutoGrowTextarea
        value={val}
        onChange={e => canEdit && setVal(e.target.value)}
        readOnly={!canEdit}
        placeholder={canEdit ? 'Ör: Müşteri X ile keşif görüşmesi planla, 25 Nisan’a kadar…' : '—'}
        minRows={6}
        className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm leading-relaxed focus:outline-none focus:border-indigo-300 bg-white resize-none"
      />
      {canEdit && (
        <div className="flex justify-end">
          <button onClick={save}
            className="px-5 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">
            {saved ? '✅ Kaydedildi' : 'Kaydet'}
          </button>
        </div>
      )}
    </div>
  );
}

// ── Idea detail modal ──────────────────────────────────────────────────
function IdeaDetailModal({ idea, onClose, canEdit }) {
  const { state, dispatch, role, viewerToken } = useContext(Ctx);
  // Submitter can edit ONLY the 4 problem-field answers + their name —
  // not the rest of the card (Next Step, Notes, Canvas, Evaluation,
  // stage move, delete, etc). Admin retains full edit via canEdit.
  const ownsThisCard = role === 'viewer'
    && idea.submittedByToken
    && idea.submittedByToken === viewerToken;
  const canEditProblem = canEdit || ownsThisCard;
  const [tab, setTab] = useState('nextStep');
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({
    title: idea.title, tagline: idea.tagline || '',
    description: idea.description || '',
    owner: idea.owner || '',
    tags: Array.isArray(idea.tags) ? idea.tags : [],
  });

  const liveIdea = state.ideas.find(i => i.id === idea.id) || idea;

  const saveEdit = () => {
    dispatch({ type: 'UPDATE_IDEA', id: idea.id, updates: form });
    setEditing(false);
  };

  const evalResult = liveIdea.stageData?.[idea.stageId]?.evaluation?.result;
  const evalIcon   = { approved: '✅', rejected: '❌', 'on-hold': '⏸️' }[evalResult] || '';

  const noteCount   = Object.values(liveIdea.stageData || {}).reduce((a, sd) => a + (sd.notes?.length || 0), 0);
  const canvasCount = (liveIdea.canvases || []).length;

  return (
    <Modal isOpen onClose={onClose} title={null} size="xl">
      <div className="p-6 pb-4">
        {/* Header */}
        <div className="flex items-start justify-between gap-3 mb-4">
          <div className="flex-1 min-w-0">
            {editing ? (
              <input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })}
                className="text-xl font-bold w-full border-b-2 border-indigo-300 outline-none pb-1 mb-2" />
            ) : (
              <h2 className="text-xl font-bold text-slate-800 mb-1">{liveIdea.title}</h2>
            )}
            <div className="flex items-center gap-2 flex-wrap">
              {evalIcon && <span className="text-sm">{evalIcon}</span>}
              <span className="text-xs text-slate-400">{new Date(liveIdea.createdAt).toLocaleDateString('tr-TR')}</span>
              {liveIdea.owner && <span className="text-xs text-slate-500">👤 {liveIdea.owner}</span>}
            </div>
          </div>
          {canEdit && (
            <div className="flex gap-2 flex-shrink-0">
              {editing ? (
                <>
                  <button onClick={saveEdit}
                    className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Kaydet</button>
                  <button onClick={() => setEditing(false)}
                    className="px-4 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-sm">İptal</button>
                </>
              ) : (
                <button onClick={() => setEditing(true)}
                  className="px-4 py-1.5 bg-slate-100 text-slate-700 rounded-lg text-sm hover:bg-slate-200">
                  ✏️ Düzenle
                </button>
              )}
            </div>
          )}
        </div>

        {/* Edit form */}
        {editing && (
          <div className="bg-slate-50 rounded-xl p-4 mb-4 space-y-3 border border-slate-200">
            <div>
              <label className="text-xs font-semibold text-slate-500 uppercase">Kısa Tanım (kartta görünür)</label>
              <input value={form.tagline} onChange={e => setForm({ ...form, tagline: e.target.value })}
                placeholder="Fikri tek cümleyle özetle…"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-300" />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 uppercase">Açıklama</label>
              <textarea value={form.description} onChange={e => setForm({ ...form, description: e.target.value })}
                rows={2}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 resize-none focus:outline-none focus:border-indigo-300" />
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 uppercase">Sorumlu</label>
              <input value={form.owner} onChange={e => setForm({ ...form, owner: e.target.value })}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mt-1 focus:outline-none focus:border-indigo-300" />
            </div>
          </div>
        )}

        {!editing && (liveIdea.tagline || liveIdea.description || (liveIdea.tags || []).length > 0) && (
          <div className="mb-4 bg-slate-50 rounded-xl px-4 py-3 space-y-1.5">
            {liveIdea.tagline && <p className="text-sm font-medium text-slate-700">{liveIdea.tagline}</p>}
            {liveIdea.description && <p className="text-sm text-slate-500">{liveIdea.description}</p>}
            {(liveIdea.tags || []).length > 0 && (
              <div className="flex flex-wrap gap-1 pt-1">
                {liveIdea.tags.map(t => (
                  <span key={t} className="text-xs font-medium bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full">#{t}</span>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Stage breadcrumb (display-only — visual progress indicator) */}
        <div className="mb-4 overflow-x-auto">
          <div className="flex items-center gap-1 min-w-max">
            {state.stages.map((st, i) => {
              const isActive = st.id === liveIdea.stageId;
              const isPast   = state.stages.findIndex(s => s.id === liveIdea.stageId) > i;
              return (
                <React.Fragment key={st.id}>
                  <div
                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap select-none ${
                      isActive ? 'text-white ring-2 ring-slate-800/80' : isPast ? 'text-white opacity-60' : 'bg-slate-100 text-slate-400'
                    }`}
                    style={isActive || isPast ? { background: st.color } : {}}>
                    {st.name}
                  </div>
                  {i < state.stages.length - 1 && <span className="text-slate-300 text-xs">›</span>}
                </React.Fragment>
              );
            })}
          </div>
          {canEdit && (
            <div className="mt-2 flex items-center gap-2">
              <span className="text-xs text-slate-400">Taşı:</span>
              {state.stages.filter(s => s.id !== liveIdea.stageId).map(s => (
                <button key={s.id}
                  onClick={() => { dispatch({ type: 'MOVE_IDEA', id: idea.id, stageId: s.id }); }}
                  className="text-xs px-2 py-1 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 font-medium">
                  → {s.name}
                </button>
              ))}
            </div>
          )}
        </div>

        {/* Problem submission summary (when idea was created via the 4-question form) */}
        {liveIdea.problemFields && (
          <div className="mb-4 bg-experian-blue/5 border border-experian-blue/20 rounded-2xl p-4">
            <div className="flex items-center justify-between mb-3 gap-2">
              <h4 className="text-sm font-bold text-experian-blue tracking-wide uppercase">
                📩 Problem / Fırsat Özeti
              </h4>
              {canEditProblem ? (
                <input
                  value={liveIdea.submittedBy || ''}
                  onChange={e => dispatch({
                    type: 'UPDATE_IDEA', id: idea.id,
                    updates: { submittedBy: e.target.value }
                  })}
                  placeholder="Adın"
                  className="text-xs bg-white text-experian-blue px-2.5 py-1 rounded-full font-medium border border-experian-blue/20 focus:outline-none focus:ring-2 focus:ring-experian-blue/20 max-w-[180px]"
                />
              ) : (
                liveIdea.submittedBy && (
                  <span className="text-xs bg-white text-experian-blue px-2.5 py-1 rounded-full font-medium border border-experian-blue/20">
                    👤 {liveIdea.submittedBy}
                  </span>
                )
              )}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {PROBLEM_FIELDS.map(f => {
                const v = (liveIdea.problemFields || {})[f.id] || '';
                if (!canEditProblem && !v && f.id === 'solution') return null;
                return (
                  <div key={f.id} className="bg-white rounded-xl p-3 border border-experian-blue/10">
                    <p className="text-[11px] font-bold text-experian-magenta uppercase tracking-wide mb-1">
                      {f.label}
                    </p>
                    {canEditProblem ? (
                      <textarea
                        value={v}
                        onChange={e => {
                          const next = { ...(liveIdea.problemFields || {}), [f.id]: e.target.value };
                          // Keep title/tagline in sync with first two answers
                          const updates = { problemFields: next };
                          if (f.id === 'problem') updates.title = (e.target.value || '').trim().slice(0, 80) || liveIdea.title;
                          dispatch({ type: 'UPDATE_IDEA', id: idea.id, updates });
                        }}
                        rows={f.id === 'solution' ? 4 : 3}
                        placeholder={f.placeholder}
                        className="w-full text-sm text-slate-700 outline-none bg-transparent resize-y focus:ring-2 focus:ring-experian-blue/15 rounded px-1"
                      />
                    ) : (
                      <p className="text-sm text-slate-700 whitespace-pre-wrap">
                        {v || <span className="italic text-slate-400">—</span>}
                      </p>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* Tabs */}
        <div className="border-b border-slate-200 mb-4">
          <div className="flex">
            {[
              { id: 'nextStep',   label: '➡️ Next Step',    badge: liveIdea.nextStep ? '•' : null },
              { id: 'notes',      label: '📝 Notlar',       badge: noteCount || null },
              { id: 'canvas',     label: '🗂️ Canvas',       badge: canvasCount || null },
              { id: 'evaluation', label: '✅ Değerlendirme', badge: null },
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-4 py-2.5 text-sm font-medium border-b-2 transition-colors flex items-center gap-1.5 ${
                  tab === t.id ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'
                }`}>
                {t.label}
                {t.badge != null && (
                  <span className={`text-xs px-1.5 py-0.5 rounded-full font-bold ${
                    tab === t.id ? 'bg-indigo-100 text-indigo-600' : 'bg-slate-100 text-slate-500'
                  }`}>{t.badge}</span>
                )}
              </button>
            ))}
          </div>
        </div>

        <div className="pb-2">
          {tab === 'nextStep'   && <NextStepPanel idea={liveIdea} canEdit={canEdit} />}
          {tab === 'notes'      && <NotesPanel idea={liveIdea} stageId={liveIdea.stageId} canEdit={canEdit} />}
          {tab === 'canvas'     && <CanvasEditor idea={liveIdea} canEdit={canEdit} />}
          {tab === 'evaluation' && <EvaluationPanel idea={liveIdea} stageId={liveIdea.stageId} canEdit={canEdit} />}
        </div>

        <div className="flex items-center justify-between mt-4 pt-4 border-t border-slate-100">
          {(canEdit || ownsThisCard) ? (
            <button onClick={() => {
              if (confirm('Bu fikri silmek istediğinize emin misiniz?')) {
                dispatch({ type: 'DELETE_IDEA', id: idea.id });
                onClose();
              }
            }} className="text-sm text-red-400 hover:text-red-600">🗑️ Fikri Sil</button>
          ) : (
            <span className="text-xs text-slate-400 bg-slate-100 px-3 py-1 rounded-full">👁️ Görüntüleme modu</span>
          )}
          <p className="text-xs text-slate-400">
            Oluşturuldu: {new Date(liveIdea.createdAt).toLocaleDateString('tr-TR')} ·
            Güncellendi: {new Date(liveIdea.updatedAt).toLocaleDateString('tr-TR')}
          </p>
        </div>
      </div>
    </Modal>
  );
}

// ── Card tag picker ────────────────────────────────────────────────────
function CardTagPicker({ idea, canEdit }) {
  const { state, dispatch } = useContext(Ctx);
  const [open, setOpen] = useState(false);
  const library = Array.isArray(state.tagLibrary) ? state.tagLibrary : [];
  const selected = Array.isArray(idea.tags) ? idea.tags : [];
  const available = library.filter(t => !selected.includes(t));
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [open]);

  const setTags = (tags) => {
    dispatch({ type: 'UPDATE_IDEA', id: idea.id, updates: { tags } });
  };

  const toggle = (t) => {
    if (selected.includes(t)) setTags(selected.filter(x => x !== t));
    else setTags([...selected, t]);
  };

  const removeTag = (e, t) => {
    e.stopPropagation();
    setTags(selected.filter(x => x !== t));
  };

  return (
    <div className="flex flex-wrap items-center gap-1 mb-2" onClick={e => e.stopPropagation()}>
      {selected.map(t => (
        <span key={t} className="flex items-center gap-0.5 text-[10px] font-medium bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-full">
          #{t}
          {canEdit && (
            <button onClick={(e) => removeTag(e, t)}
              className="text-indigo-300 hover:text-red-500 text-xs leading-none">×</button>
          )}
        </span>
      ))}
      {canEdit && (
        <div className="relative" ref={ref}>
          <button onClick={(e) => { e.stopPropagation(); setOpen(v => !v); }}
            className="text-[10px] text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 border border-dashed border-slate-300 hover:border-indigo-300 rounded-full px-1.5 py-0.5">
            + Tag
          </button>
          {open && (
            <div className="absolute left-0 top-full mt-1 z-20 bg-white border border-slate-200 rounded-xl shadow-lg p-2 w-48 max-h-56 overflow-y-auto">
              {library.length === 0 ? (
                <p className="text-xs text-slate-400 italic px-2 py-1">
                  Önce "🏷️ Tag Ekle"den etiket oluştur
                </p>
              ) : (
                <div className="flex flex-wrap gap-1">
                  {library.map(t => {
                    const on = selected.includes(t);
                    return (
                      <button key={t} onClick={() => toggle(t)}
                        className={`text-[11px] px-2 py-0.5 rounded-full border transition-colors ${
                          on ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-indigo-50 hover:border-indigo-300'
                        }`}>
                        {on ? '✓ ' : ''}#{t}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Idea card ──────────────────────────────────────────────────────────
function IdeaCard({ idea, onOpen, canEdit }) {
  const noteCount   = Object.values(idea.stageData || {}).reduce((a, sd) => a + (sd.notes?.length || 0), 0);
  const canvasCount = (idea.canvases || []).length;
  const evalResult  = idea.stageData?.[idea.stageId]?.evaluation?.result;
  const evalIcon    = { approved: '✅', rejected: '❌', 'on-hold': '⏸️' }[evalResult] || '';

  return (
    <div draggable
      onDragStart={e => { e.dataTransfer.setData('ideaId', idea.id); e.dataTransfer.effectAllowed = 'move'; }}
      onClick={() => onOpen(idea)}
      className="bg-white rounded-xl shadow-sm border border-slate-200 p-3.5 cursor-pointer
                 hover:shadow-md hover:border-indigo-200 active:opacity-70 transition-all select-none">
      <div className="flex items-start justify-between gap-2 mb-1.5">
        <h4 className="text-sm font-semibold text-slate-800 leading-snug flex-1">{idea.title}</h4>
        {evalIcon && <span className="flex-shrink-0 text-base">{evalIcon}</span>}
      </div>

      {idea.tagline && (
        <p className="text-xs text-slate-500 mb-2 line-clamp-2 leading-relaxed">{idea.tagline}</p>
      )}

      <CardTagPicker idea={idea} canEdit={canEdit} />

      {(noteCount > 0 || canvasCount > 0 || idea.owner) && (
        <div className="flex items-center gap-3 pt-2 border-t border-slate-50">
          {noteCount   > 0 && <span className="text-xs text-slate-400">📝 {noteCount}</span>}
          {canvasCount > 0 && <span className="text-xs text-slate-400">🗂️ {canvasCount}</span>}
          {idea.owner && <span className="text-xs text-slate-400 ml-auto truncate">👤 {idea.owner}</span>}
        </div>
      )}
    </div>
  );
}

// ── Inline add form ────────────────────────────────────────────────────
function AddIdeaInline({ stageId, onDone }) {
  const { dispatch } = useContext(Ctx);
  const [title, setTitle] = useState('');
  const [tagline, setTagline] = useState('');

  const submit = () => {
    if (!title.trim()) return;
    dispatch({ type: 'ADD_IDEA', title: title.trim(), tagline: tagline.trim(), stageId });
    setTitle(''); setTagline(''); onDone();
  };

  return (
    <div className="bg-white rounded-xl border-2 border-indigo-300 p-3 shadow-sm">
      <input autoFocus value={title} onChange={e => setTitle(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') onDone(); }}
        placeholder="Fikir başlığı…"
        className="w-full text-sm font-semibold outline-none mb-2 placeholder:font-normal placeholder:text-slate-400" />
      <input value={tagline} onChange={e => setTagline(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') submit(); if (e.key === 'Escape') onDone(); }}
        placeholder="Tek cümle açıklama… (kartta görünür)"
        className="w-full text-xs outline-none mb-2 text-slate-600 placeholder:text-slate-400" />
      <div className="flex gap-2 justify-end">
        <button onClick={onDone}
          className="text-xs px-3 py-1.5 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200">İptal</button>
        <button onClick={submit}
          className="text-xs px-3 py-1.5 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-medium">Ekle</button>
      </div>
    </div>
  );
}

// ── Problem submission modal (4 yapılandırılmış soru) ─────────────────
// Hem admin hem viewer rolünün problem ekleyebilmesi için. Viewer
// yalnızca yeni problem gönderebilir; mevcut kartları düzenleyemez.
const PROBLEM_FIELDS = [
  { id: 'problem',  label: '1. Problem / Fırsat nedir?',                       placeholder: 'Çözülmesi gereken sorunu veya yakalanan fırsatı kısaca anlat…' },
  { id: 'segment',  label: '2. Problemin sahibi hedef segment kimdir?',         placeholder: 'Bu problemi yaşayan kullanıcı / müşteri segmenti…' },
  { id: 'audience', label: '3. Fırsat ile hizmet edilecek kitle nedir?',        placeholder: 'Çözüm hayata geçtiğinde fayda sağlanacak kitle…' },
  { id: 'solution', label: '4. Çözüm önerin varsa yazabilir misin? (opsiyonel)', placeholder: 'Aklındaki çözüm fikrini paylaşabilirsin…' },
];

function ProblemSubmissionModal({ stageId, onClose, role }) {
  const { dispatch, viewerToken } = useContext(Ctx);
  const [vals, setVals] = useState({ problem: '', segment: '', audience: '', solution: '' });
  const [submittedBy, setSubmittedBy] = useState('');
  const [err, setErr] = useState('');
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);

  const set = (id, v) => setVals(prev => ({ ...prev, [id]: v }));

  const submit = () => {
    if (!vals.problem.trim()) { setErr('1. soru zorunlu — Problem / Fırsat nedir?'); return; }
    if (!vals.segment.trim()) { setErr('2. soru zorunlu — Hedef segment kimdir?'); return; }
    if (!vals.audience.trim()) { setErr('3. soru zorunlu — Hizmet edilecek kitle nedir?'); return; }
    setErr('');
    setSaving(true);
    const title = vals.problem.trim().slice(0, 80);
    dispatch({
      type: 'ADD_IDEA',
      stageId,
      title,
      tagline: '',
      problemFields: {
        problem:  vals.problem.trim(),
        segment:  vals.segment.trim(),
        audience: vals.audience.trim(),
        solution: vals.solution.trim(),
      },
      submittedBy: submittedBy.trim() || (role === 'viewer' ? 'Viewer' : 'Admin'),
      submittedByToken: viewerToken,
    });
    setTimeout(() => { setSaving(false); setDone(true); }, 250);
  };

  return (
    <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl my-8 ring-1 ring-experian-blue/10 overflow-hidden">
        {/* Header */}
        <div className="bg-experian-blue px-6 py-4 flex items-start justify-between">
          <div>
            <p className="text-[10px] font-bold tracking-[0.3em] text-experian-magenta uppercase">
              Experian Innovation
            </p>
            <h2 className="text-xl font-extrabold text-white mt-1">Problem / Fırsat Gönder</h2>
            <p className="text-xs text-white/70 mt-1">
              4 soruyu cevapla — gönderildikten sonra Innovation Board ekibi değerlendirir.
            </p>
          </div>
          <button onClick={onClose}
            className="text-white/70 hover:text-white text-2xl leading-none">&times;</button>
        </div>

        {done ? (
          <div className="p-8 text-center">
            <div className="text-5xl mb-3">✅</div>
            <h3 className="text-lg font-bold text-experian-blue mb-1">Teşekkürler!</h3>
            <p className="text-sm text-slate-600 mb-6">
              Problemin Innovation pipeline'ına eklendi. Innovation Board ekibi inceleyecek.
            </p>
            <div className="flex justify-center gap-2">
              <button onClick={() => { setVals({ problem:'', segment:'', audience:'', solution:'' }); setSubmittedBy(''); setDone(false); }}
                className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-medium hover:bg-slate-200">
                Bir tane daha gönder
              </button>
              <button onClick={onClose}
                className="px-4 py-2 bg-experian-blue text-white rounded-xl text-sm font-medium hover:bg-experian-blue/90">
                Kapat
              </button>
            </div>
          </div>
        ) : (
          <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
            {PROBLEM_FIELDS.map(f => (
              <div key={f.id}>
