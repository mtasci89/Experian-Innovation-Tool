                <label className="block text-sm font-semibold text-experian-blue mb-1.5">{f.label}</label>
                <textarea
                  value={vals[f.id]}
                  onChange={e => set(f.id, e.target.value)}
                  placeholder={f.placeholder}
                  rows={f.id === 'solution' ? 4 : 3}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-experian-blue focus:ring-2 focus:ring-experian-blue/15 resize-y"
                />
              </div>
            ))}
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
                Adın (opsiyonel)
              </label>
              <input
                value={submittedBy}
                onChange={e => setSubmittedBy(e.target.value)}
                placeholder="Adın — kim gönderiyor?"
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-experian-blue focus:ring-2 focus:ring-experian-blue/15"
              />
            </div>

            {err && (
              <div className="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-2.5 rounded-xl">
                {err}
              </div>
            )}

            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button onClick={onClose}
                className="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-sm font-medium hover:bg-slate-200">
                İptal
              </button>
              <button onClick={submit} disabled={saving}
                className="px-5 py-2 bg-experian-blue text-white rounded-xl text-sm font-semibold hover:bg-experian-blue/90 disabled:opacity-60">
                {saving ? 'Gönderiliyor…' : 'Gönder'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Pipeline column ────────────────────────────────────────────────────
function PipelineColumn({ stage, ideas, onOpen, canEdit, onStageReorder, role }) {
  const { dispatch } = useContext(Ctx);
  const [showAdd, setShowAdd] = useState(false);
  const [showProblemModal, setShowProblemModal] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [stageDragOver, setStageDragOver] = useState(false);
  // Problem column: anyone (admin OR viewer) can submit a structured problem.
  // Detect by id OR by name so it still works when stages are renamed/added.
  const isProblemStage = stage.id === 'problem' || /problem/i.test(stage.name || '');
  const canAddHere     = canEdit || isProblemStage;

  return (
    <div className={`flex-shrink-0 w-[272px] flex flex-col transition-opacity ${stageDragOver ? 'opacity-40' : ''}`}
         onDragOver={e => {
           e.preventDefault();
           if (e.dataTransfer.types.includes('stage-id')) setStageDragOver(true);
           else setDragOver(true);
         }}
         onDragLeave={e => {
           if (!e.currentTarget.contains(e.relatedTarget)) {
             setDragOver(false); setStageDragOver(false);
           }
         }}
         onDrop={e => {
           e.preventDefault(); setDragOver(false); setStageDragOver(false);
           const droppedStageId = e.dataTransfer.getData('stage-id');
           const ideaId = e.dataTransfer.getData('ideaId');
           if (droppedStageId && onStageReorder) onStageReorder(droppedStageId, stage.id);
           else if (ideaId && canEdit) dispatch({ type: 'MOVE_IDEA', id: ideaId, stageId: stage.id });
         }}>
      <div className={`flex items-center justify-between px-4 py-3 rounded-t-2xl ${canEdit ? 'cursor-grab active:cursor-grabbing' : ''}`}
           style={{ background: stage.color }}
           draggable={canEdit}
           onDragStart={e => {
             e.dataTransfer.setData('stage-id', stage.id);
             e.dataTransfer.effectAllowed = 'move';
           }}>
        <div className="flex items-center gap-2">
          {canEdit && <span className="text-white/50 text-xs select-none mr-1">⠿</span>}
          <span className="font-bold text-white text-sm">{stage.name}</span>
          <span className="bg-white/25 text-white text-xs px-2 py-0.5 rounded-full">{ideas.length}</span>
        </div>
        {canAddHere && (
          <button
            onClick={() => isProblemStage ? setShowProblemModal(true) : setShowAdd(true)}
            onDragStart={e => e.stopPropagation()}
            title={isProblemStage ? 'Problem / Fırsat gönder' : 'Yeni kart ekle'}
            className="text-white/80 hover:text-white text-2xl font-light w-7 h-7 flex items-center justify-center rounded-lg hover:bg-white/20 transition-colors">
            +
          </button>
        )}
      </div>

      <div className={`flex-1 rounded-b-2xl p-3 space-y-2 min-h-[320px] transition-colors ${
        dragOver && canEdit ? 'bg-indigo-50 ring-2 ring-indigo-400 ring-inset' : 'bg-slate-100'
      }`}>
        {/* Problem column entry hint — admin and viewer both use the same
            structured form, so the CTA is shown to anyone who can post here. */}
        {isProblemStage && (
          <button onClick={() => setShowProblemModal(true)}
            className="w-full text-xs px-3 py-2 bg-experian-blue/5 border border-dashed border-experian-blue/40 text-experian-blue rounded-xl hover:bg-experian-blue/10 font-medium">
            ＋ Problem / Fırsat Gönder
          </button>
        )}
        {showAdd && (
          <AddIdeaInline stageId={stage.id} onDone={() => setShowAdd(false)} />
        )}
        {showProblemModal && (
          <ProblemSubmissionModal
            stageId={stage.id}
            role={role}
            onClose={() => setShowProblemModal(false)} />
        )}
        {ideas.map(idea => <IdeaCard key={idea.id} idea={idea} onOpen={onOpen} canEdit={canEdit} />)}
        {ideas.length === 0 && !showAdd && (
          <div className="flex items-center justify-center h-24 text-slate-300 text-xs select-none">
            {canEdit ? 'Buraya sürükleyin veya + ekleyin' : 'Fikir yok'}
          </div>
        )}
      </div>
    </div>
  );
}

// ── Settings modal ─────────────────────────────────────────────────────
// ── Canvas templates manager (Settings tab) ────────────────────────────
function CanvasTemplatesManager({ templates, dispatch }) {
  const [expandedId, setExpandedId] = useState(null);
  const [newTmplName, setNewTmplName] = useState('');
  const [dragSecId, setDragSecId] = useState(null);

  const save = (next) => dispatch({ type: 'SET_CANVAS_TEMPLATES', templates: next });

  const addTemplate = () => {
    if (!newTmplName.trim()) return;
    const t = { id: 'tmpl-' + Date.now(), name: newTmplName.trim(), sections: [] };
    save([...(templates || []), t]);
    setNewTmplName('');
    setExpandedId(t.id);
  };

  const deleteTemplate = (id) => {
    const t = templates.find(x => x.id === id);
    if (!confirm(`"${t?.name || 'Şablon'}" şablonunu silmek istiyor musunuz? (Mevcut canvas’lar etkilenmez)`)) return;
    save(templates.filter(x => x.id !== id));
  };

  const renameTemplate = (id, name) => {
    save(templates.map(t => t.id === id ? { ...t, name } : t));
  };

  const addSection = (tmplId, name) => {
    if (!name.trim()) return;
    save(templates.map(t => t.id === tmplId
      ? { ...t, sections: [...(t.sections || []), { id: 'sec-' + Date.now(), name: name.trim() }] }
      : t));
  };

  const updateSection = (tmplId, secId, patch) => {
    save(templates.map(t => t.id === tmplId
      ? { ...t, sections: (t.sections || []).map(s => s.id === secId ? { ...s, ...patch } : s) }
      : t));
  };

  const deleteSection = (tmplId, secId) => {
    save(templates.map(t => t.id === tmplId
      ? { ...t, sections: (t.sections || []).filter(s => s.id !== secId) }
      : t));
  };

  const reorderSection = (tmplId, fromId, toId) => {
    if (!fromId || !toId || fromId === toId) return;
    save(templates.map(t => {
      if (t.id !== tmplId) return t;
      const list = [...(t.sections || [])];
      const fi = list.findIndex(s => s.id === fromId);
      const ti = list.findIndex(s => s.id === toId);
      if (fi < 0 || ti < 0) return t;
      const [moved] = list.splice(fi, 1);
      list.splice(ti, 0, moved);
      return { ...t, sections: list };
    }));
  };

  return (
    <div className="space-y-4">
      <div className="bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-800">
        Şablonlardan yeni canvas oluşturulurken bölümler kopyalanır. Burada yapılan değişiklikler eski canvas’ları etkilemez.
      </div>

      {(templates || []).map(tmpl => (
        <TemplateRow key={tmpl.id}
          tmpl={tmpl}
          expanded={expandedId === tmpl.id}
          onToggle={() => setExpandedId(expandedId === tmpl.id ? null : tmpl.id)}
          onRename={(name) => renameTemplate(tmpl.id, name)}
          onDelete={() => deleteTemplate(tmpl.id)}
          onAddSection={(name) => addSection(tmpl.id, name)}
          onUpdateSection={(secId, patch) => updateSection(tmpl.id, secId, patch)}
          onDeleteSection={(secId) => deleteSection(tmpl.id, secId)}
          onReorderSection={(fromId, toId) => reorderSection(tmpl.id, fromId, toId)}
          dragSecId={dragSecId}
          setDragSecId={setDragSecId}
        />
      ))}

      <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
        <h4 className="text-sm font-semibold text-slate-700 mb-2">Yeni Şablon Ekle</h4>
        <div className="flex gap-2">
          <input value={newTmplName} onChange={e => setNewTmplName(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addTemplate()}
            placeholder="Şablon adı (örn. Product Canvas)"
            className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-300" />
          <button onClick={addTemplate}
            className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">
            + Ekle
          </button>
        </div>
      </div>
    </div>
  );
}

function TemplateRow({ tmpl, expanded, onToggle, onRename, onDelete, onAddSection, onUpdateSection, onDeleteSection, onReorderSection, dragSecId, setDragSecId }) {
  const [editingName, setEditingName] = useState(false);
  const [nameVal, setNameVal] = useState(tmpl.name);
  const [newSecName, setNewSecName] = useState('');
  const [editingSecId, setEditingSecId] = useState(null);
  const [editingSecVal, setEditingSecVal] = useState('');

  useEffect(() => { setNameVal(tmpl.name); }, [tmpl.name]);

  const commitName = () => {
    if (nameVal.trim() && nameVal !== tmpl.name) onRename(nameVal.trim());
    setEditingName(false);
  };

  const commitSec = () => {
    if (editingSecId && editingSecVal.trim()) {
      onUpdateSection(editingSecId, { name: editingSecVal.trim() });
    }
    setEditingSecId(null); setEditingSecVal('');
  };

  return (
    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <div className="flex items-center gap-2 p-3">
        <button onClick={onToggle} className="text-slate-400 hover:text-slate-600 text-sm w-6 text-center">
          {expanded ? '▼' : '▶'}
        </button>
        {editingName ? (
          <input autoFocus value={nameVal} onChange={e => setNameVal(e.target.value)}
            onBlur={commitName}
            onKeyDown={e => { if (e.key === 'Enter') commitName(); if (e.key === 'Escape') { setNameVal(tmpl.name); setEditingName(false); } }}
            className="flex-1 border-b border-indigo-400 outline-none text-sm font-semibold text-slate-800 bg-transparent" />
        ) : (
          <span onClick={() => setEditingName(true)}
            className="flex-1 text-sm font-semibold text-slate-800 cursor-text hover:text-indigo-600">
            {tmpl.name}
          </span>
        )}
        <span className="text-xs text-slate-400">{(tmpl.sections || []).length} bölüm</span>
        <button onClick={() => setEditingName(true)}
          className="text-xs text-slate-400 hover:text-indigo-600 px-2 py-1 rounded hover:bg-slate-50">Adı Düzenle</button>
        <button onClick={onDelete}
          className="text-xs text-red-400 hover:text-red-600 px-2 py-1 rounded hover:bg-red-50">Sil</button>
      </div>

      {expanded && (
        <div className="border-t border-slate-100 p-3 bg-slate-50 space-y-2">
          {(tmpl.sections || []).length === 0 && (
            <p className="text-xs text-slate-400 italic">Henüz bölüm eklenmemiş</p>
          )}
          {(tmpl.sections || []).map((sec, i) => {
            const isDragOver = dragSecId && dragSecId !== sec.id;
            const isJourney = sec.type === 'journey';
            return (
              <div key={sec.id}
                draggable={editingSecId !== sec.id}
                onDragStart={e => { e.dataTransfer.setData('tmpl-sec-id', sec.id); e.dataTransfer.effectAllowed = 'move'; setDragSecId(sec.id); }}
                onDragEnd={() => setDragSecId(null)}
                onDragOver={e => e.preventDefault()}
                onDrop={e => { e.preventDefault(); const from = e.dataTransfer.getData('tmpl-sec-id'); onReorderSection(from, sec.id); setDragSecId(null); }}
                className={`flex items-center gap-2 bg-white rounded-lg p-2 border ${isDragOver ? 'border-indigo-400 border-dashed' : 'border-slate-200'}`}>
                <span className="text-slate-300 cursor-grab select-none text-sm" title="Sürükle">⠿</span>
                <span className="text-xs text-slate-400 w-5 text-center">{i + 1}</span>
                {editingSecId === sec.id ? (
                  <input autoFocus value={editingSecVal}
                    onChange={e => setEditingSecVal(e.target.value)}
                    onBlur={commitSec}
                    onKeyDown={e => { if (e.key === 'Enter') commitSec(); if (e.key === 'Escape') { setEditingSecId(null); setEditingSecVal(''); } }}
                    className="flex-1 border-b border-indigo-400 outline-none text-sm text-slate-700 bg-transparent" />
                ) : (
                  <span onClick={() => { setEditingSecId(sec.id); setEditingSecVal(sec.name); }}
                    className="flex-1 text-sm text-slate-700 cursor-text hover:text-indigo-600">
                    {sec.name}
                  </span>
                )}
                <button onClick={() => onUpdateSection(sec.id, { type: isJourney ? 'text' : 'journey' })}
                  title={isJourney ? 'Düz metne çevir' : 'User Journey akışı yap'}
                  className={`text-xs px-2 py-0.5 rounded ${isJourney ? 'bg-indigo-100 text-indigo-700' : 'text-slate-400 hover:bg-slate-100'}`}>
                  🛣️ {isJourney ? 'Akış' : 'Metin'}
                </button>
                <button onClick={() => { setEditingSecId(sec.id); setEditingSecVal(sec.name); }}
                  className="text-xs text-slate-400 hover:text-indigo-600 px-2 py-1">Düzenle</button>
                <button onClick={() => onDeleteSection(sec.id)}
                  className="text-xs text-red-400 hover:text-red-600 px-2 py-1">Sil</button>
              </div>
            );
          })}
          <div className="flex gap-2 pt-2">
            <input value={newSecName} onChange={e => setNewSecName(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && newSecName.trim()) { onAddSection(newSecName); setNewSecName(''); } }}
              placeholder="Yeni bölüm adı"
              className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-indigo-300" />
            <button onClick={() => { if (newSecName.trim()) { onAddSection(newSecName); setNewSecName(''); } }}
              className="px-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">
              + Bölüm
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ── Tag library manager ────────────────────────────────────────────────
function TagLibraryModal({ onClose }) {
  const { state, dispatch } = useContext(Ctx);
  const library = Array.isArray(state.tagLibrary) ? state.tagLibrary : [];
  const [val, setVal] = useState('');

  const add = () => {
    const clean = val.trim().replace(/^#+/, '');
    if (!clean) return;
    if (library.some(t => t.toLowerCase() === clean.toLowerCase())) { setVal(''); return; }
    dispatch({ type: 'SET_TAG_LIBRARY', tags: [...library, clean] });
    setVal('');
  };

  const remove = (tag) => {
    if (!confirm(`"#${tag}" etiketini kütüphaneden silmek istiyor musunuz? (Kartlardaki mevcut etiketler korunur)`)) return;
    dispatch({ type: 'SET_TAG_LIBRARY', tags: library.filter(t => t !== tag) });
  };

  // Count how many cards use each tag
  const counts = {};
  (state.ideas || []).forEach(i => (i.tags || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }));

  return (
    <Modal isOpen onClose={onClose} title="🏷️ Tag Kütüphanesi" size="md">
      <div className="p-6 space-y-4">
        <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-xs text-indigo-800">
          Buraya eklediğiniz etiketler kartlardaki <b>"+ Tag"</b> seçeneğinden kullanılabilir olur.
        </div>

        <div className="flex gap-2">
          <input autoFocus value={val} onChange={e => setVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && add()}
            placeholder="Etiket adı (örn. fintech)"
            className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-300" />
          <button onClick={add}
            className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">
            + Ekle
          </button>
        </div>

        {library.length === 0 ? (
          <p className="text-sm text-slate-400 italic text-center py-4">Henüz etiket yok. Yukarıdan ekleyin.</p>
        ) : (
          <div className="flex flex-wrap gap-2">
            {library.map(t => (
              <span key={t} className="flex items-center gap-1.5 bg-indigo-50 text-indigo-700 text-sm px-3 py-1.5 rounded-full border border-indigo-200">
                #{t}
                {counts[t] > 0 && (
                  <span className="text-[10px] bg-indigo-200 text-indigo-800 rounded-full px-1.5">
                    {counts[t]}
                  </span>
                )}
                <button onClick={() => remove(t)}
                  className="text-indigo-400 hover:text-red-500 text-base leading-none ml-0.5">&times;</button>
              </span>
            ))}
          </div>
        )}
      </div>
    </Modal>
  );
}

function SettingsModal({ onClose, onLogout }) {
  const { state, dispatch, authCfg: ctxAuthCfg, setAuthCfg: ctxSetAuthCfg } = useContext(Ctx);
  const [tab, setTab]           = useState('pipeline');
  const [newName, setNewName]   = useState('');
  const [newColor, setNewColor] = useState(PALETTE[4]);
  const [editId, setEditId]     = useState(null);
  const [editName, setEditName] = useState('');
  const [editColor, setEditColor] = useState('');

  // Auth config — shared via Firebase (context)
  const authCfg = ctxAuthCfg || { enabled: false, adminPass: '', viewerPass: '', securityQ: '', securityA: '' };
  const [adminPass, setAdminPass]   = useState('');
  const [viewerPass, setViewerPass] = useState('');
  const [securityQ, setSecurityQ]   = useState('');
  const [securityA, setSecurityA]   = useState('');
  const [authSaved, setAuthSaved]   = useState(false);
  const [inviteMsg, setInviteMsg]   = useState('');
  const [inviteEmail, setInviteEmail] = useState('');

  const addStage = () => {
    if (!newName.trim()) return;
    dispatch({ type: 'ADD_STAGE', name: newName.trim(), color: newColor });
    setNewName('');
  };

  const moveStage = (idx, dir) => {
    const stages = [...state.stages];
    const target = idx + dir;
    if (target < 0 || target >= stages.length) return;
    [stages[idx], stages[target]] = [stages[target], stages[idx]];
    dispatch({ type: 'REORDER_STAGES', stages });
  };

  const saveAuth = () => {
    const cfg = {
      enabled: !!(adminPass || viewerPass || authCfg.adminPass || authCfg.viewerPass),
      adminPass:  adminPass  || authCfg.adminPass  || '',
      viewerPass: viewerPass || authCfg.viewerPass || '',
      securityQ:  securityQ  || authCfg.securityQ  || '',
      securityA:  securityA  || authCfg.securityA  || '',
    };
    // Write to Firebase — syncs across all browsers
    try { db.ref('authConfig').set(cfg); } catch (e) {}
    // Keep localStorage mirror for offline fallback
    saveAuthConfig(cfg);
    ctxSetAuthCfg && ctxSetAuthCfg(cfg);
    setAdminPass(''); setViewerPass(''); setSecurityQ(''); setSecurityA('');
    setAuthSaved(true);
    setTimeout(() => setAuthSaved(false), 2000);
  };

  const disableAuth = () => {
    const cfg = { enabled: false, adminPass: '', viewerPass: '', securityQ: '', securityA: '' };
    try { db.ref('authConfig').set(cfg); } catch (e) {}
    saveAuthConfig(cfg);
    ctxSetAuthCfg && ctxSetAuthCfg(cfg);
    setAdminPass(''); setViewerPass(''); setSecurityQ(''); setSecurityA('');
  };

  const sendInvite = (role) => {
    const cfg = authCfg;
    const pass = role === 'admin' ? cfg.adminPass : cfg.viewerPass;
    const url  = window.location.href;
    const subject = encodeURIComponent('Innovation Tool Erişim Daveti');
    const body = encodeURIComponent(
      `Merhaba,\n\nİnovation Tool'a davet edildiniz.\n\n` +
      `🔗 Adres: ${url}\n` +
      `🔑 Şifre: ${pass}\n` +
      `👤 Rol: ${role === 'admin' ? 'Yönetici (Admin)' : 'Görüntüleyici (Viewer)'}\n\n` +
      `Aracı açtığınızda şifreyi girerek giriş yapabilirsiniz.`
    );
    window.open(`mailto:${encodeURIComponent(inviteEmail.trim())}?subject=${subject}&body=${body}`);
    setInviteMsg(`${role === 'admin' ? 'Admin' : 'Viewer'} daveti e-posta istemcisinde açıldı`);
    setTimeout(() => setInviteMsg(''), 3000);
  };

  return (
    <Modal isOpen onClose={onClose} title="⚙️ Ayarlar" size="lg">
      <div className="border-b border-slate-100">
        <div className="flex px-2 overflow-x-auto">
          {[
            { id: 'pipeline',  label: '🔷 Pipeline' },
            { id: 'canvases',  label: '🗂️ Canvas Şablonları' },
            { id: 'auth',      label: '🔐 Erişim Yönetimi' },
            { id: 'data',      label: '💾 Veri' },
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`px-5 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition-colors ${
                tab === t.id ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700'
              }`}>
              {t.label}
            </button>
          ))}
        </div>
      </div>

      <div className="p-6">
        {/* ── Pipeline tab ── */}
        {tab === 'pipeline' && (
          <div>
            <p className="text-sm text-slate-500 mb-3">
              Adımları ekleyin, yeniden adlandırın, renk değiştirin veya sıralayın.
            </p>

            {/* One-click apply Experian-aligned stage palette */}
            <div className="mb-5 bg-experian-blue/5 border border-experian-blue/20 rounded-xl p-3 flex items-center gap-3">
              <div className="flex gap-1 flex-shrink-0">
                {EXPERIAN_STAGE_PALETTE.map(c => (

                  const sorted = [...state.stages].sort((a, b) => a.order - b.order);
                  sorted.forEach((s, i) => {
                    const color = EXPERIAN_STAGE_PALETTE[i % EXPERIAN_STAGE_PALETTE.length];

// ── Export helpers ─────────────────────────────────────────────────────
const EVAL_LABELS_EX = { approved: '✅ Onaylandı', 'on-hold': '⏸️ Beklemede', rejected: '❌ Reddedildi' };
const NOTE_LABELS_EX = {
  text: 'Not', 'customer-feedback': 'Müşteri Geri Bildirimi',
  'potential-customer': 'Potansiyel Müşteri', mvp: 'MVP Süreci',
  'mvp-feedback': 'MVP Geri Bildirimi', feasibility: 'Fizibilite', link: 'Link/Dosya',
};

function makeSheetName(title, usedSet) {
  let base = (title || 'Fikir').replace(/[\\\/\?\*\[\]:]/g, '').trim().slice(0, 27) || 'Fikir';
  let name = base; let i = 2;
  while (usedSet.has(name)) name = `${base.slice(0, 24)}_${i++}`;
  usedSet.add(name);
  return name;
}

function doExcelExport(state) {
  if (!window.XLSX) { alert('Excel kütüphanesi henüz yüklenmedi, lütfen sayfayı yenileyip tekrar deneyin.'); return; }
  const XL = window.XLSX;
  const wb = XL.utils.book_new();
  const stages = [...state.stages].sort((a, b) => a.order - b.order);

  // Build sheetName map
  const usedSet = new Set(['Pipeline Özeti']);
  const nameMap = {};
  state.ideas.forEach(idea => { nameMap[idea.id] = makeSheetName(idea.title, usedSet); });

  // ── Ana Sheet ───────────────────────────────────────────────────────
  const aoa = [
    ['Innovation Pipeline Raporu', '', '', '', '', ''],
    [`Tarih: ${new Date().toLocaleDateString('tr-TR')}  |  Toplam Fikir: ${state.ideas.length}`, '', '', '', '', ''],
    [],
  ];
  let rIdx = 3;
  const links = [];

  stages.forEach(stage => {
    const ideas = state.ideas.filter(i => i.stageId === stage.id);
    aoa.push([`▌ ${stage.name}  (${ideas.length} fikir)`, '', '', '', '', '']);
    rIdx++;
    aoa.push(['Fikir Adı', 'Tanım', 'Sorumlu', 'Değerlendirme', 'Not', 'Canvas']);
    rIdx++;
    ideas.forEach(idea => {
      const ev = Object.values(idea.stageData || {}).map(sd => sd.evaluation).find(e => e?.result);
      const nc = Object.values(idea.stageData || {}).reduce((a, sd) => a + (sd.notes?.length || 0), 0);
      links.push({ r: rIdx, c: 0, target: `#'${nameMap[idea.id]}'!A1` });
      aoa.push([idea.title, idea.tagline || '', idea.owner || '',
        ev ? (EVAL_LABELS_EX[ev.result] || '') : '', nc || '', (idea.canvases || []).length || '']);
      rIdx++;
    });
    if (!ideas.length) { aoa.push(['(henüz fikir yok)', '', '', '', '', '']); rIdx++; }
    aoa.push([]); rIdx++;
  });

  const mainWs = XL.utils.aoa_to_sheet(aoa);
  mainWs['!cols'] = [{ wch: 36 }, { wch: 42 }, { wch: 18 }, { wch: 17 }, { wch: 6 }, { wch: 8 }];
  links.forEach(({ r, c, target }) => {
    const ref = XL.utils.encode_cell({ r, c });
    if (mainWs[ref]) mainWs[ref].l = { Target: target };
  });
  XL.utils.book_append_sheet(wb, mainWs, 'Pipeline Özeti');

  // ── Kart Sheet'leri ─────────────────────────────────────────────────
  state.ideas.forEach(idea => {
    const stageName = state.stages.find(s => s.id === idea.stageId)?.name || '-';
    const sn = nameMap[idea.id];
    const rows = [
      ['FİKİR', idea.title], ['ADIM', stageName],
      ['SORUMLU', idea.owner || '-'], ['KISA TANIM', idea.tagline || '-'],
      ['AÇIKLAMA', idea.description || '-'],
      ['OLUŞTURULDU', new Date(idea.createdAt).toLocaleDateString('tr-TR')],
      [],
    ];

    // Canvas
    (idea.canvases || []).forEach(canvas => {
      rows.push([`◆ CANVAS: ${canvas.name}`, '']);
      rows.push(['Bölüm', 'İçerik']);
      canvas.sections.forEach(s => rows.push([s.name, s.content || '']));
      rows.push([]);
    });

    // Notlar
    const allNotes = Object.entries(idea.stageData || {}).flatMap(([sid, sd]) => {
      const sn2 = state.stages.find(s => s.id === sid)?.name || sid;
      return (sd.notes || []).map(n => ({ sn2, n }));
    });
    if (allNotes.length) {
      rows.push(['◆ NOTLAR', '', '', '']);
      rows.push(['Adım', 'Tür', 'İçerik', 'Tarih']);
      allNotes.forEach(({ sn2, n }) => rows.push([
        sn2, NOTE_LABELS_EX[n.type] || n.type,
        n.file ? `[Dosya: ${n.file.name}]` : (n.content || ''),
        new Date(n.createdAt).toLocaleDateString('tr-TR'),
      ]));
      rows.push([]);
    }

    // Değerlendirmeler
    const evList = Object.entries(idea.stageData || {})
      .filter(([, sd]) => sd.evaluation?.result)
      .map(([sid, sd]) => ({ sn2: state.stages.find(s => s.id === sid)?.name || sid, ev: sd.evaluation }));
    if (evList.length) {
      rows.push(['◆ DEĞERLENDİRMELER', '', '', '', '']);
      rows.push(['Adım', 'Sonuç', 'Özet', 'Sonraki Adımlar', 'Tarih']);
      evList.forEach(({ sn2, ev }) => rows.push([
        sn2, EVAL_LABELS_EX[ev.result] || ev.result, ev.summary || '', ev.nextSteps || '',
        ev.evaluatedAt ? new Date(ev.evaluatedAt).toLocaleDateString('tr-TR') : '',
      ]));
    }

    const ws = XL.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 22 }, { wch: 20 }, { wch: 58 }, { wch: 20 }, { wch: 14 }];
    if (ws['A1']) ws['A1'].l = { Target: "#'Pipeline Özeti'!A1" };
    XL.utils.book_append_sheet(wb, ws, sn);
  });

  XL.writeFile(wb, `innovation-pipeline-${new Date().toISOString().slice(0, 10)}.xlsx`);
}

  });
  // Italic subtitle
  cover.addText('Konseptten Ölçeğe Disiplinli, Hızlı ve\nEkosistemi Mobilize Eden Bir İnovasyon Modeli', {
    x: 0.5, y: 4.0, w: 9.0, h: 1.0,
    fontSize: 18, italic: true, color: MID, fontFace: 'Arial',
  });
  // Magenta accent bar
  cover.addShape('rect', { x: 0.5, y: 5.4, w: 1.5, h: 0.06, fill: { color: ACCENT }, line: { color: ACCENT, width: 0 } });
  // Footer meta
  cover.addText(
    [
      { text: 'Tarih: ', options: { italic: true, color: MID } },
      { text: new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }), options: { bold: true, color: BRAND } },
      { text: '   ·   ', options: { color: MID } },
      { text: `${state.ideas.length} Fikir`, options: { bold: true, color: BRAND } },
      { text: '   ·   ', options: { color: MID } },
      { text: `${stages.length} Adım`, options: { bold: true, color: BRAND } },
    ],
    { x: 0.5, y: 5.6, w: 9.0, h: 0.4, fontSize: 13, fontFace: 'Arial' }
  );
  cover.addText('Experian Innovation Framework  ·  Internal', {
    x: 0.5, y: 7.05, w: 9.0, h: 0.3, fontSize: 10, color: '8F97A0', italic: true, fontFace: 'Arial',
  });

  // ── Pipeline özet slaytı ─────────────────────────────────────────────
  const ov = pptx.addSlide();
  ov.background = { color: 'FFFFFF' };
  // Top brand bar
  ov.addShape('rect', { x: 0, y: 0, w: 13.33, h: 0.08, fill: { color: BRAND }, line: { color: BRAND, width: 0 } });
  ov.addShape('rect', { x: 0, y: 0.08, w: 13.33, h: 0.04, fill: { color: ACCENT }, line: { color: ACCENT, width: 0 } });
  ov.addText('Pipeline Özeti', { x: 0.4, y: 0.25, w: 12.5, h: 0.6, fontSize: 24, bold: true, color: BRAND, fontFace: 'Arial' });
  ov.addShape('rect', { x: 0.4, y: 0.82, w: 1.2, h: 0.05, fill: { color: ACCENT }, line: { color: ACCENT, width: 0 } });

  const cols = Math.min(stages.length, 6);
  const colW = 12.5 / cols;
  stages.slice(0, 6).forEach((stage, i) => {
    const ideas = state.ideas.filter(id => id.stageId === stage.id);
    const x = 0.4 + i * colW;
    ov.addText(stage.name, {
      x, y: 1.05, w: colW - 0.12, h: 0.42,
      fontSize: 10, bold: true, color: 'FFFFFF',
      fill: { color: hex(stage.color) }, align: 'center', valign: 'middle',
    });
    const bullets = ideas.map(id => ({ text: `• ${id.title.slice(0, 34)}\n`, options: { fontSize: 9, color: DARK } }));
    if (!bullets.length) bullets.push({ text: '(boş)', options: { fontSize: 9, color: MID, italic: true } });
    ov.addText(bullets, { x, y: 1.55, w: colW - 0.12, h: 5.5, valign: 'top' });
  });
  // Footer brand mark
  ov.addText('Experian Innovation Framework', {
    x: 0.4, y: 7.15, w: 12.5, h: 0.25, fontSize: 9, color: '8F97A0', italic: true, fontFace: 'Arial', align: 'right',
  });

  // ── Kart slaytları ───────────────────────────────────────────────────
  const PAGE_W = 13.33, PAGE_H = 7.5, PAD = 0.35;
  // Slide numbering tracker — used for image hyperlinks (1-based).
  // Cover = 1, Overview = 2, then idea slides (with detail slides interleaved).
  let slideCount = 2;
  const CONTENT_W = PAGE_W - PAD * 2;
  const stageById = id => state.stages.find(s => s.id === id);

  state.ideas.forEach(idea => {
    const stage = stageById(idea.stageId);
    const sl = pptx.addSlide();
    slideCount++;
    const myIdeaSlideNum = slideCount;
    sl.background = { color: 'FFFFFF' };

    // Pre-compute slide numbers for per-section image-detail slides so we
    // can wire up hyperlinks before the detail slides actually exist.
    const _canvasForLinks = (idea.canvases || [])[0];
    const _sections       = _canvasForLinks?.sections || [];
    const imgSlideNums    = new Map(); // section-index → detail slide number
    let _detailCursor = slideCount;
    _sections.forEach((sec, idx) => {
      const _hasImg     = !!sec.image;
      const _hasJourney = sec.type === 'journey' && Array.isArray(sec.steps) && sec.steps.length > 0;
      if (_hasImg || _hasJourney) { _detailCursor++; imgSlideNums.set(idx, _detailCursor); }
    });

    // Üst başlık bar (stage rengi) + Experian magenta accent stripe altında
    sl.addShape('rect', { x: 0, y: 0, w: PAGE_W, h: 0.85, fill: { color: hex(stage?.color) }, line: { color: hex(stage?.color), width: 0 } });
    sl.addShape('rect', { x: 0, y: 0.85, w: PAGE_W, h: 0.04, fill: { color: ACCENT }, line: { color: ACCENT, width: 0 } });
    sl.addText(idea.title, { x: PAD, y: 0.10, w: 9.6, h: 0.65, fontSize: 20, bold: true, color: 'FFFFFF' });
    if (stage) sl.addText(`📍 ${stage.name}`, {
      x: 10.0, y: 0.12, w: PAGE_W - 10.0 - PAD, h: 0.32,
      fontSize: 11, color: 'FFFFFF', align: 'right',
    });
    // Tags right under stage name (top-right)
    const tagList = Array.isArray(idea.tags) ? idea.tags : [];
    if (tagList.length) {
      sl.addText(tagList.map(t => `#${t}`).join('  '), {
        x: 8.0, y: 0.45, w: PAGE_W - 8.0 - PAD, h: 0.32,
        fontSize: 9, color: 'FFFFFF', align: 'right', italic: true,
      });
    }

    // Meta satırı: tagline (kartta görünür) başlığın hemen altında,
    // sonra açıklama (description), sonra owner
    let metaY = 0.92;
    if (idea.tagline) {
      sl.addText(idea.tagline, {
        x: PAD, y: metaY, w: CONTENT_W, h: 0.32,
        fontSize: 13, bold: true, color: DARK,
      });
      metaY += 0.36;
    }
    if (idea.description) {
      sl.addText(idea.description, {
        x: PAD, y: metaY, w: CONTENT_W, h: 0.28,
        fontSize: 10.5, italic: true, color: MID,
      });
      metaY += 0.32;
    }
    if (idea.owner) {
      sl.addText(`👤 ${idea.owner}`, {
        x: PAD, y: metaY, w: CONTENT_W, h: 0.26,
        fontSize: 10, color: MID,
      });
      metaY += 0.3;
    }

    // Layout: üstte Next Step (sol) + Notlar (sağ), altta Canvas
    // Top block kept compact so canvas grid below has breathing room.
    const topY      = metaY + 0.05;
    const topH      = 1.7;
    const topBottom = topY + topH;
    const midGap    = 0.15;

    // ── ÜST-SOL: Next Step ──
    const leftX = PAD;
    const leftW = (CONTENT_W - midGap) / 2;
    sl.addText('➡️ Next Step', {
      x: leftX, y: topY, w: leftW, h: 0.28,
      fontSize: 12, bold: true, color: BRAND,
    });
    sl.addShape('roundRect', {
      x: leftX, y: topY + 0.32, w: leftW, h: topH - 0.32,
      fill: { color: TINT_BG },
      line: { color: BLUE_M, width: 0.75 },
      rectRadius: 0.08,
    });
    const nextStepText = (idea.nextStep || '').trim() ||
      'Bu fikir için henüz bir sonraki adım belirlenmemiş.';
    sl.addText(nextStepText, {
      x: leftX + 0.15, y: topY + 0.42, w: leftW - 0.3, h: topH - 0.48,
      fontSize: 11, color: idea.nextStep ? DARK : MID,
      italic: !idea.nextStep, valign: 'top',
    });

    // ── ÜST-SAĞ: Notlar & Değerlendirmeler ──
    const rightX = leftX + leftW + midGap;
    const rightW = leftW;
    const allNotesTop = Object.entries(idea.stageData || {}).flatMap(([sid, sd]) =>
      (sd.notes || []).map(n => {
        const st = stageById(sid);
        return { sName: st?.name || '', sColor: hex(st?.color), n };
      })
    );
    const evListTop = Object.entries(idea.stageData || {})
      .filter(([, sd]) => sd.evaluation?.result)
      .map(([sid, sd]) => ({ sName: stageById(sid)?.name || '', ev: sd.evaluation }));

    sl.addText('📝 Notlar & Değerlendirmeler', {
      x: rightX, y: topY, w: rightW, h: 0.28,
      fontSize: 12, bold: true, color: BRAND,
    });

    const noteItems = [
      ...allNotesTop.map(({ sName, sColor, n }) => ({
        tag: sName || 'Not', color: sColor || BRAND, bg: SOFT_BG,
        body: n.content || (n.file ? `📎 ${n.file.name}` : ''),
      })),
      ...evListTop.map(({ sName, ev }) => {
        const c = ev.result === 'approved' ? '10B981'
                : ev.result === 'rejected' ? 'EF4444' : 'F59E0B';
        const bg = ev.result === 'approved' ? 'ECFDF5'
                 : ev.result === 'rejected' ? 'FEF2F2' : 'FFFBEB';
        return {
          tag: `${sName} · ${EVAL_LABELS_EX[ev.result] || ''}`,
          color: c, bg, body: ev.summary || '',
        };
      }),
    ];

    const notesBlockY = topY + 0.32;
    const notesBlockH = topH - 0.32;

    if (!noteItems.length) {
      sl.addShape('roundRect', {
        x: rightX, y: notesBlockY, w: rightW, h: notesBlockH,
        fill: { color: 'F8FAFC' }, line: { color: 'E2E8F0', width: 0.75 },
        rectRadius: 0.08,
      });
      sl.addText('Bu fikre henüz not veya değerlendirme eklenmemiş.', {
        x: rightX + 0.1, y: notesBlockY, w: rightW - 0.2, h: notesBlockH,
        fontSize: 10, italic: true, color: MID, align: 'center', valign: 'middle',
      });
    } else {
      const maxItems = Math.min(noteItems.length, 6);
      const nCols = maxItems <= 2 ? maxItems : (maxItems <= 4 ? 2 : 3);
      const nRows = Math.ceil(maxItems / nCols);
      const nGap  = 0.1;
      const nW = (rightW - nGap * (nCols - 1)) / nCols;
      const nH = (notesBlockH - nGap * (nRows - 1)) / nRows;

      for (let i = 0; i < maxItems; i++) {
        const it = noteItems[i];
        const r = Math.floor(i / nCols), c = i % nCols;
        const x = rightX + c * (nW + nGap);
        const y = notesBlockY + r * (nH + nGap);
        sl.addShape('roundRect', {
          x, y, w: nW, h: nH,
          fill: { color: it.bg }, line: { color: it.color, width: 0.75 },
          rectRadius: 0.06,
        });
        sl.addText(it.tag, {
          x: x + 0.08, y: y + 0.04, w: nW - 0.16, h: 0.22,
          fontSize: 7.5, bold: true, color: it.color,
        });
        sl.addText((it.body || '—').slice(0, 220), {
          x: x + 0.08, y: y + 0.26, w: nW - 0.16, h: nH - 0.3,
          fontSize: 8, color: DARK, valign: 'top',
        });
      }
      if (noteItems.length > maxItems) {
        sl.addText(`+${noteItems.length - maxItems} daha…`, {
          x: rightX, y: topBottom - 0.22, w: rightW, h: 0.18,
          fontSize: 7.5, italic: true, color: MID, align: 'right',
        });
      }
    }

    // ── ALTTA: Canvas kutu grid ──
    const canvas = (idea.canvases || [])[0];
    const canvasTop    = topBottom + 0.2;
    const canvasBottom = 7.15;

    if (canvas && canvas.sections && canvas.sections.length) {
      sl.addText(`📋 ${canvas.name}`, {
        x: PAD, y: canvasTop, w: CONTENT_W, h: 0.3,
        fontSize: 12, bold: true, color: BRAND,
      });
      const gridTop = canvasTop + 0.35;
      const gridH   = canvasBottom - gridTop;

      const secs = canvas.sections;
      const n = secs.length;
      const cellsPerRow = n <= 3 ? n : (n <= 6 ? 3 : (n <= 8 ? 4 : 3));
      const gapX = 0.12, gapY = 0.12;

      // ── Slot allocation: journey sections take a full-width row ─────
      // Other sections flow at cellsPerRow per row.
      const layoutRows = [];
      let curRow = [];
      const flush = () => { if (curRow.length) { layoutRows.push(curRow); curRow = []; } };
      secs.forEach((sec, i) => {
        const isJourney = sec.type === 'journey';
        if (isJourney) {
          flush();
          layoutRows.push([{ sec, i, span: cellsPerRow }]);
        } else {
          if (curRow.length >= cellsPerRow) flush();
          curRow.push({ sec, i, span: 1 });
        }
      });
      flush();

      // Row heights weighted: journey rows get extra vertical space.
      const rowWeights = layoutRows.map(row => row.some(c => c.sec.type === 'journey') ? 1.5 : 1);
      const totalW = rowWeights.reduce((a, b) => a + b, 0);
      const usableH = gridH - gapY * (layoutRows.length - 1);
      const rowHeights = rowWeights.map(w => usableH * w / totalW);

      let curY = gridTop;
      // Consistent column width across rows (so spans line up cleanly).
      const baseColW = (CONTENT_W - gapX * (cellsPerRow - 1)) / cellsPerRow;
      layoutRows.forEach((row, rIdx) => {
        const rowH = rowHeights[rIdx];
        let curX = PAD;
        row.forEach(({ sec, i, span }) => {
          const boxW = baseColW * span + gapX * (span - 1);
          const boxH = rowH;
          const x = curX, y = curY;

        // Kutu arka planı
        sl.addShape('roundRect', {
          x, y, w: boxW, h: boxH,
          fill: { color: 'F8FAFC' },
          line: { color: 'E2E8F0', width: 0.75 },
          rectRadius: 0.06,
        });
        // Başlık şeridi
        sl.addShape('rect', {
          x, y, w: boxW, h: 0.28,
          fill: { color: TINT_BG },
          line: { color: TINT_BG, width: 0 },
        });
        sl.addText(sec.name, {
          x: x + 0.08, y: y + 0.02, w: boxW - 0.16, h: 0.24,
          fontSize: 9, bold: true, color: BRAND,
        });

        const hasImg = !!sec.image;
        const hasJourney = sec.type === 'journey' && Array.isArray(sec.steps) && sec.steps.length > 0;
        const contentY = y + 0.32;
        const contentH = boxH - 0.36;

        const _detailSlideNum = imgSlideNums.get(i);
        const _imgHyper = _detailSlideNum
          ? { hyperlink: { slide: _detailSlideNum, tooltip: 'Tam boyut görüntülemek için tıklayın' } }
          : {};

        if (hasJourney) {
          // Native journey preview: numbered chips + step titles, link to full-flow detail slide
          const stepsToShow = sec.steps.slice(0, 5);
          const lineH = Math.max(0.18, Math.min(0.26, (contentH - 0.3) / Math.max(stepsToShow.length, 1)));
          stepsToShow.forEach((step, j) => {
            const sy = contentY + j * lineH;
            sl.addShape('ellipse', {
              x: x + 0.1, y: sy + 0.02, w: 0.18, h: 0.18,
              fill: { color: BRAND }, line: { color: BRAND, width: 0 },
            });
            sl.addText(String(j + 1), {
              x: x + 0.1, y: sy + 0.02, w: 0.18, h: 0.18,
              fontSize: 7, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle',
            });
            sl.addText((step.title || '—').slice(0, 60), {
              x: x + 0.32, y: sy, w: boxW - 0.4, h: lineH,
              fontSize: 8, bold: true, color: BRAND, valign: 'middle',
            });
          });
          const more = sec.steps.length - stepsToShow.length;
          sl.addText(more > 0 ? `🛣️ Tam akış (+${more} daha)` : '🛣️ Tam akış', {
            x: x + 0.08, y: y + boxH - 0.22, w: boxW - 0.16, h: 0.18,
            fontSize: 7, italic: true, color: ACCENT, align: 'right', bold: true,
            hyperlink: { slide: _detailSlideNum, tooltip: 'Tam akışı görüntüle' },
          });
        } else if (hasImg && sec.content) {
          // Yarı yarıya: görsel solda, metin sağda
          const halfW = (boxW - 0.24) / 2;
          try {
            sl.addImage({
              data: sec.image,
              x: x + 0.08, y: contentY, w: halfW, h: contentH,
              sizing: { type: 'contain', w: halfW, h: contentH },
              ..._imgHyper,
            });
          } catch (e) {}
          sl.addText(sec.content.slice(0, 220), {
            x: x + 0.08 + halfW + 0.08, y: contentY, w: halfW, h: contentH,
            fontSize: 8, color: DARK, valign: 'top',
          });
        } else if (hasImg) {
          try {
            sl.addImage({
              data: sec.image,
              x: x + 0.08, y: contentY, w: boxW - 0.16, h: contentH,
              sizing: { type: 'contain', w: boxW - 0.16, h: contentH },
              ..._imgHyper,
            });
          } catch (e) {}
          // Click-to-enlarge hint pinned at bottom of the box
          sl.addText('🔍 Büyüt', {
            x: x + 0.08, y: y + boxH - 0.22, w: boxW - 0.16, h: 0.18,
            fontSize: 7, italic: true, color: BRAND, align: 'right',
            hyperlink: { slide: _detailSlideNum, tooltip: 'Tam boyut görüntüle' },
          });
        } else if (sec.content) {
          sl.addText(sec.content.slice(0, 340), {
            x: x + 0.08, y: contentY, w: boxW - 0.16, h: contentH,
            fontSize: 8.5, color: DARK, valign: 'top',
          });
        } else {
          sl.addText('—', {
            x: x + 0.08, y: contentY, w: boxW - 0.16, h: contentH,
            fontSize: 9, italic: true, color: MID, valign: 'top',
          });
        }
          curX += boxW + gapX;
        });
        curY += rowH + gapY;
      });
    } else if (idea.description) {
      sl.addText(idea.description, {
        x: PAD, y: canvasTop, w: CONTENT_W, h: canvasBottom - canvasTop,
        fontSize: 11, color: DARK, valign: 'top',
      });
    }

    // Footer — Experian brand
    sl.addText('Experian Innovation Framework', {
      x: PAD, y: PAGE_H - 0.3, w: CONTENT_W / 2, h: 0.25,
      fontSize: 8, color: BRAND, bold: true, fontFace: 'Arial',
    });
    sl.addText(`Oluşturuldu: ${new Date(idea.createdAt).toLocaleDateString('tr-TR')}`,
      { x: PAD + CONTENT_W / 2, y: PAGE_H - 0.3, w: CONTENT_W / 2, h: 0.25, fontSize: 7.5, color: MID, align: 'right' });

    // ── Detay slaytları ───────────────────────────────────────────────
    // Görsel içeren ve/veya journey-step içeren bölümler için tam boy
    // detay slaytı; canvas grid'indeki preview oraya hyperlinkli.
    _sections.forEach((sec, idx) => {
      const _hasImg     = !!sec.image;
      const _hasJourney = sec.type === 'journey' && Array.isArray(sec.steps) && sec.steps.length > 0;
      if (!_hasImg && !_hasJourney) return;

      const ds = pptx.addSlide();
      slideCount++;
      ds.background = { color: 'FFFFFF' };
      // Brand header
      ds.addShape('rect', { x: 0, y: 0, w: PAGE_W, h: 0.6, fill: { color: BRAND }, line: { color: BRAND, width: 0 } });
      ds.addShape('rect', { x: 0, y: 0.6, w: PAGE_W, h: 0.04, fill: { color: ACCENT }, line: { color: ACCENT, width: 0 } });
      ds.addText(`${idea.title}  ·  ${sec.name}`, {
        x: PAD, y: 0.12, w: CONTENT_W - 1.8, h: 0.4,
        fontSize: 16, bold: true, color: 'FFFFFF', fontFace: 'Arial',
      });
      ds.addText('← Karta dön', {
        x: PAGE_W - PAD - 1.8, y: 0.18, w: 1.8, h: 0.3,
        fontSize: 11, color: 'FFFFFF', align: 'right',
        hyperlink: { slide: myIdeaSlideNum, tooltip: 'Karta geri dön' },
      });

      if (_hasJourney) {
        // Native horizontal journey flow in Experian palette
        const steps = sec.steps;
        const flowY  = 1.05;
        const flowH  = PAGE_H - 1.55;
        const arrowW = 0.32;
        const cardW  = Math.max(1.3, Math.min(2.2, (CONTENT_W - (steps.length - 1) * arrowW) / Math.max(steps.length, 1)));
        const totalW = steps.length * cardW + (steps.length - 1) * arrowW;
        const startX = (PAGE_W - totalW) / 2;

        steps.forEach((step, j) => {
          const sx = startX + j * (cardW + arrowW);
          // Card body
          ds.addShape('roundRect', {
            x: sx, y: flowY, w: cardW, h: flowH,
            fill: { color: 'FFFFFF' },
            line: { color: BRAND, width: 1.25 },
            rectRadius: 0.1,
          });
          // Two-tone top strip (brand → purple)
          ds.addShape('rect', {
            x: sx, y: flowY, w: cardW * 0.5, h: 0.08,
            fill: { color: BRAND }, line: { color: BRAND, width: 0 },
          });
          ds.addShape('rect', {
            x: sx + cardW * 0.5, y: flowY, w: cardW * 0.5, h: 0.08,
            fill: { color: PURPLE }, line: { color: PURPLE, width: 0 },
          });
          // Number badge
          ds.addShape('ellipse', {
            x: sx + 0.18, y: flowY + 0.22, w: 0.42, h: 0.42,
            fill: { color: BRAND }, line: { color: BRAND, width: 0 },
          });
          ds.addText(String(j + 1), {
            x: sx + 0.18, y: flowY + 0.22, w: 0.42, h: 0.42,
            fontSize: 16, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle',
          });
          // Title
          ds.addText(step.title || '—', {
            x: sx + 0.18, y: flowY + 0.78, w: cardW - 0.36, h: 0.6,
            fontSize: 13, bold: true, color: BRAND, valign: 'top', fontFace: 'Arial',
          });
          // Description
          ds.addText(step.description || '', {
            x: sx + 0.18, y: flowY + 1.42, w: cardW - 0.36, h: flowH - 1.55,
            fontSize: 10, color: DARK, valign: 'top', fontFace: 'Arial',
          });
          // Arrow
          if (j < steps.length - 1) {
            const ay = flowY + flowH / 2;
            ds.addShape('rightArrow', {
              x: sx + cardW + 0.04, y: ay - 0.16, w: arrowW - 0.08, h: 0.32,
              fill: { color: ACCENT }, line: { color: ACCENT, width: 0 },
            });
          }
        });
      } else {
        // Görsel detay (yalnızca image varsa)
        const imgY = 0.85, imgH = PAGE_H - 1.2;
        try {
          ds.addImage({
            data: sec.image,
            x: PAD, y: imgY, w: CONTENT_W, h: imgH,
            sizing: { type: 'contain', w: CONTENT_W, h: imgH },
          });
        } catch (e) {}
      }

      ds.addText('Experian Innovation Framework', {
        x: PAD, y: PAGE_H - 0.3, w: CONTENT_W, h: 0.25,
        fontSize: 8, color: BRAND, italic: true, align: 'right', fontFace: 'Arial',
      });
    });
  });

  pptx.writeFile({ fileName: `innovation-pipeline-${new Date().toISOString().slice(0, 10)}.pptx` });
}

// ── Export menu component ──────────────────────────────────────────────
function ExportMenu({ state }) {
  const [open, setOpen] = useState(false);
  const [busy, setBusy]   = useState('');
  const ref = useRef();

  useEffect(() => {
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const run = (type) => {
    setOpen(false); setBusy(type);
    setTimeout(() => {
      try { type === 'excel' ? doExcelExport(state) : doPptExport(state); }
      catch (e) { alert('Export hatası: ' + e.message); }
      setBusy('');
    }, 80);
  };

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(o => !o)} disabled={!!busy}
        className="flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 text-sm font-medium disabled:opacity-50 transition-colors">
        {busy ? '⏳' : '📤'} {busy === 'excel' ? 'Excel…' : busy === 'ppt' ? 'PPT…' : 'Export'}
        {!busy && <span className="text-slate-400 text-xs">▾</span>}
      </button>
      {open && (
        <div className="absolute right-0 top-11 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 z-50 min-w-[190px]">
          <button onClick={() => run('excel')}
            className="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
            <span className="text-lg">📊</span>
            <div><p className="font-medium">Excel'e Aktar</p><p className="text-xs text-slate-400">.xlsx dosyası</p></div>
          </button>
          <button onClick={() => run('ppt')}
            className="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
            <span className="text-lg">📑</span>

          </button>
        </div>
      )}
    </div>
  );
}

  const cfg = authCfg || getAuthConfig();
  const hasSecurity = !!(cfg.securityQ && cfg.securityA);

  const tryLogin = () => {
    setError('');
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (cfg.adminPass && pass === cfg.adminPass) {
        onLogin('admin');

// Shareable link — anyone with the viewer (or admin) password can fill in
// the 4-question form without entering the main app. Submission writes a
// new card directly into Firebase under the Problem stage.
function SubmitProblemPage() {
  const [authCfg, setAuthCfg]   = useState(null);
  const [authed, setAuthed]     = useState(false);
  const [pass, setPass]         = useState('');
  const [authErr, setAuthErr]   = useState('');
  const [vals, setVals]         = useState({ problem:'', segment:'', audience:'', solution:'' });
  const [submittedBy, setSubmittedBy] = useState('');
  const [err, setErr]           = useState('');
  const [saving, setSaving]     = useState(false);
  const [done, setDone]         = useState(false);

  // Persistent anonymous token (so the same browser keeps identity)
  const [viewerToken] = useState(() => {
    const KEY = 'innovation-tool-viewer-id';
    try {
      let t = localStorage.getItem(KEY);
      if (!t) { t = 'v-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36); localStorage.setItem(KEY, t); }
      return t;
    } catch (e) { return 'v-fallback'; }
  });

  useEffect(() => {
    const ref = db.ref('authConfig');
    const handler = ref.on('value', snap => setAuthCfg(snap.val() || null));
    return () => ref.off('value', handler);
  }, []);

  const tryAuth = () => {
    setAuthErr('');
    const cfg = authCfg || {};
    if (!pass) { setAuthErr('Lütfen şifreyi girin.'); return; }
    if (pass === cfg.adminPass || pass === cfg.viewerPass) {
      setAuthed(true);
    } else {
      setAuthErr('Hatalı şifre.');
      setPass('');
    }
  };

  const submit = async () => {
    if (!vals.problem.trim()) { setErr('1. soru zorunlu — Problem / Fırsat nedir?'); return; }
    if (!vals.segment.trim()) { setErr('2. soru zorunlu — Hedef segment kimdir?'); return; }
    if (!vals.audience.trim()) { setErr('3. soru zorunlu — Hizmet edilecek kitle nedir?'); return; }
    setErr(''); setSaving(true);
    try {
      const snap = await db.ref('appData').once('value');
      const data = snap.val() || {};
      const stages = Array.isArray(data.stages) ? data.stages : DEFAULT_STAGES;
      const problemStage = stages.find(s => /problem/i.test(s.name || '')) || stages.find(s => s.id === 'problem') || stages[0];
      if (!problemStage) throw new Error('Problem aşaması bulunamadı.');
      const idea = {
        id: 'id-' + Math.random().toString(36).slice(2) + Date.now().toString(36),
        title: vals.problem.trim().slice(0, 80),
        tagline: '',
        description: '',
        stageId: problemStage.id,
        createdAt: Date.now(), updatedAt: Date.now(),
        owner: '', tags: [], stageData: {}, canvases: [],
        problemFields: {
          problem:  vals.problem.trim(),
          segment:  vals.segment.trim(),
          audience: vals.audience.trim(),
          solution: vals.solution.trim(),
        },
        submittedBy: submittedBy.trim() || 'Anonim',
        submittedByToken: viewerToken,
      };
      const ideas = Array.isArray(data.ideas) ? [...data.ideas, idea] : [idea];
      await db.ref('appData').set({ ...data, stages, ideas, updatedAt: Date.now() });
      setDone(true);
    } catch (e) {
      setErr('Gönderme başarısız: ' + (e.message || 'bilinmeyen hata'));
    } finally {
      setSaving(false);
    }
  };

  const Brand = (
    <div className="text-center mb-6">
      <div className="flex justify-center mb-3">
        <span className="ex-mark size-lg" aria-hidden="true">
          <i className="s1"></i><i className="s2"></i><i className="s3"></i><i className="s4"></i>
        </span>
      </div>
      <p className="text-[10px] font-bold tracking-[0.3em] text-experian-magenta uppercase mb-1">
        Experian Turkey
      </p>
      <h1 className="text-2xl font-extrabold text-experian-blue leading-tight">Innovation Framework</h1>
      <span className="ex-accent-bar mx-auto mt-3"></span>
    </div>
  );

  return (
    <div className="min-h-screen bg-white relative overflow-hidden flex items-center justify-center px-4 py-8">
      {/* Decorative shapes (consistent with login screen) */}
      <div aria-hidden="true" className="absolute -top-32 -right-32 w-[28rem] h-[28rem] rounded-[3rem] bg-experian-blue/90"></div>
      <div aria-hidden="true" className="absolute top-32 right-12 w-28 h-28 rounded-3xl bg-experian-magenta"></div>
      <div aria-hidden="true" className="absolute top-12 right-56 w-16 h-16 rounded-2xl bg-experian-purple"></div>
      <div aria-hidden="true" className="absolute -bottom-24 -left-24 w-72 h-72 rounded-[3rem] bg-experian-purple/80"></div>

      {/* Auth gate */}
      {!authed && !done && (
        <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 ring-1 ring-experian-blue/5">
          {Brand}
          <p className="text-sm text-slate-600 text-center mb-5">
            Bu form Innovation Framework'e bir <span className="font-semibold text-experian-blue">Problem / Fırsat</span> göndermek içindir. Devam etmek için viewer şifresini gir.
          </p>
          <input
            type="password" autoFocus value={pass}
            onChange={e => setPass(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && tryAuth()}
            placeholder="••••••••"
            className="w-full border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-experian-blue focus:ring-2 focus:ring-experian-blue/15 mb-3"
          />
          {authErr && (
            <div className="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-2.5 rounded-xl mb-3">
              {authErr}
            </div>
          )}
          <button onClick={tryAuth} disabled={!authCfg}
            className="w-full py-3 bg-experian-blue text-white rounded-xl font-semibold hover:bg-experian-blue/90 transition-colors disabled:opacity-60">
            {authCfg ? 'Devam' : 'Yükleniyor…'}
          </button>
        </div>
      )}

      {/* Form */}
      {authed && !done && (
        <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl ring-1 ring-experian-blue/5 overflow-hidden">
          <div className="bg-experian-blue px-6 py-5">
            <p className="text-[10px] font-bold tracking-[0.3em] text-experian-magenta uppercase">
              Experian Innovation
            </p>
            <h2 className="text-xl font-extrabold text-white mt-1">Problem / Fırsat Gönder</h2>
            <p className="text-xs text-white/70 mt-1">
              4 soruyu cevapla. Innovation Board ekibi inceleyecek.
            </p>
          </div>
          <div className="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
            {PROBLEM_FIELDS.map(f => (
              <div key={f.id}>
                <label className="block text-sm font-semibold text-experian-blue mb-1.5">{f.label}</label>
                <textarea
                  value={vals[f.id]}
                  onChange={e => setVals(prev => ({ ...prev, [f.id]: e.target.value }))}
                  placeholder={f.placeholder}
                  rows={f.id === 'solution' ? 4 : 3}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-experian-blue focus:ring-2 focus:ring-experian-blue/15 resize-y"
                />
              </div>
            ))}
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">
                Adın (opsiyonel)
              </label>
              <input
                value={submittedBy}
                onChange={e => setSubmittedBy(e.target.value)}
                placeholder="Adın — kim gönderiyor?"
                className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-experian-blue focus:ring-2 focus:ring-experian-blue/15"
              />
            </div>
            {err && (
              <div className="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-2.5 rounded-xl">
                {err}
              </div>
            )}
            <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
              <button onClick={submit} disabled={saving}
                className="px-6 py-2.5 bg-experian-blue text-white rounded-xl text-sm font-semibold hover:bg-experian-blue/90 disabled:opacity-60">
                {saving ? 'Gönderiliyor…' : 'Gönder'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Success */}
      {done && (
        <div className="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 text-center ring-1 ring-experian-blue/5">
          {Brand}
          <div className="text-5xl mb-3">✅</div>
          <h3 className="text-lg font-bold text-experian-blue mb-1">Teşekkürler!</h3>
          <p className="text-sm text-slate-600 mb-6">
            Problemin Innovation pipeline'ına eklendi. Innovation Board ekibi inceleyecek.
          </p>
          <button onClick={() => {
            setVals({ problem:'', segment:'', audience:'', solution:'' });
            setSubmittedBy(''); setDone(false); setErr('');
          }}
            className="px-5 py-2.5 bg-experian-blue text-white rounded-xl text-sm font-semibold hover:bg-experian-blue/90">
            Bir tane daha gönder
          </button>
        </div>
      )}
    </div>
  );

// ── Root App ───────────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, null, getInitialState);
  const [openIdea, setOpenIdea]     = useState(null);
  // Anonymous viewer identity — persisted in localStorage so a viewer who
  // submits a problem can re-edit only THEIR own card across sessions.
  const VIEWER_TOKEN_KEY = 'innovation-tool-viewer-id';
  const [viewerToken] = useState(() => {
    try {
      let t = localStorage.getItem(VIEWER_TOKEN_KEY);
      if (!t) {
        t = 'v-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
        localStorage.setItem(VIEWER_TOKEN_KEY, t);
      }
      return t;
    } catch (e) { return 'v-fallback'; }
  });
  const [showSettings, setShowSettings] = useState(false);
  const [showTagLib, setShowTagLib]     = useState(false);
  const [search, setSearch]         = useState('');
  const [role, setRole]             = useState(null);
  const [dbLoading, setDbLoading]   = useState(true);
  const [authCfg, setAuthCfg]       = useState(null); // null = loading
  const [authChecked, setAuthChecked] = useState(false);
  const stateRef = useRef(state);
  stateRef.current = state;

  // Firebase sync — appData
  useEffect(() => {
    const ref = db.ref('appData');
    const handler = ref.on('value', snapshot => {
      const data = snapshot.val();
      if (data) {
        dispatch({ type: 'SYNC_FROM_FIREBASE', data });
      } else {
        // Firebase appData is empty/null — possible causes:
        //  (a) genuinely first run, or
        //  (b) data was wiped/lost.
        // We NEVER auto-overwrite from a stale localStorage anymore — that's
        // exactly the failure mode that ate previous cards. Ask first.
        const local = localStorage.getItem(STORAGE_KEY);
        let seed = null;
        try { seed = local ? JSON.parse(local) : null; } catch (e) {}
        const hasLocalIdeas = seed && Array.isArray(seed.ideas) && seed.ideas.length > 0;
        if (hasLocalIdeas) {
          const ok = window.confirm(
            'Buluttaki veri boş, ancak bu tarayıcıda ' + seed.ideas.length +
            ' adet kart içeren yerel bir yedek bulundu.\n\n' +
            'Yerel yedekten geri yüklensin mi?\n\n' +
            'Tamam: yedeği Firebase\'e yaz (geri yükle)\n' +
            'İptal: boş başlat (yerel yedek kaybolmaz, gerekirse sonra elle import edilebilir)'
          );
          if (ok) {
            db.ref('appData').set({ ...seed, updatedAt: Date.now() });
          } else {
            db.ref('appData').set({ ...stateRef.current, updatedAt: Date.now() });
          }
        } else {
          db.ref('appData').set({ ...stateRef.current, updatedAt: Date.now() });
        }
      }
      setDbLoading(false);
    });
    return () => ref.off('value', handler);
  }, []);

  // Firebase sync — authConfig (shared across all browsers)
  useEffect(() => {
    const ref = db.ref('authConfig');
    const handler = ref.on('value', snapshot => {
      const data = snapshot.val();
      setAuthCfg(data || { enabled: false, adminPass: '', viewerPass: '', securityQ: '', securityA: '' });
    });
    return () => ref.off('value', handler);
  }, []);

  // Auth gate — runs ONCE after authCfg loads.
  // Every page load requires re-login (no session caching).
  useEffect(() => {
    if (!authCfg || authChecked) return;
    clearSession(); // always wipe any stale session on load
    if (!authCfg.enabled) setRole('admin');
    else setRole('login');
    setAuthChecked(true);
  }, [authCfg, authChecked]);

  const canEdit = role === 'admin';

  const pipelineIdeas = state.ideas;

  const searchResults = search
    ? state.ideas.filter(i =>
        i.title.toLowerCase().includes(search.toLowerCase()) ||
        (i.tagline || '').toLowerCase().includes(search.toLowerCase()) ||
        (i.description || '').toLowerCase().includes(search.toLowerCase()) ||
        (i.tags || []).some(t => t.toLowerCase().includes(search.toLowerCase())) ||
        (i.owner || '').toLowerCase().includes(search.toLowerCase())
      )
    : [];

  const totalNotes = state.ideas.reduce((acc, i) =>
    acc + Object.values(i.stageData || {}).reduce((a, sd) => a + (sd.notes?.length || 0), 0), 0);

  const handleOpenIdea = idea => {
    const latest = state.ideas.find(i => i.id === idea.id);
    setOpenIdea(latest || idea);
  };

  const handleStageReorder = useCallback((fromId, toId) => {
    if (fromId === toId) return;
    const sorted = [...state.stages].sort((a, b) => a.order - b.order);
    const fromIdx = sorted.findIndex(s => s.id === fromId);
    const toIdx   = sorted.findIndex(s => s.id === toId);
    if (fromIdx === -1 || toIdx === -1) return;
    const updated = [...sorted];
    const [removed] = updated.splice(fromIdx, 1);
    updated.splice(toIdx, 0, removed);
    dispatch({ type: 'REORDER_STAGES', stages: updated });
  }, [state.stages, dispatch]);

  // Loading screen
  if (dbLoading || !authCfg) {
    return (
      <div className="min-h-screen bg-white flex items-center justify-center">
        <div className="text-center">
          <div className="flex justify-center mb-4 animate-pulse">
            <span className="ex-mark size-lg" aria-hidden="true">
              <i className="s1"></i><i className="s2"></i><i className="s3"></i><i className="s4"></i>
            </span>
          </div>
          <p className="text-experian-blue font-semibold text-sm">Experian Innovation</p>
          <p className="text-slate-500 text-xs mt-1">Veriler yükleniyor…</p>
        </div>
      </div>
    );
  }

  // Login screen
  if (role === 'login' || role === null) {
    if (role === null) return null;
    return <LoginScreen onLogin={r => setRole(r)} authCfg={authCfg} />;
  }

  return (
    <Ctx.Provider value={{ state, dispatch, authCfg, setAuthCfg, role, viewerToken }}>
      {/* Top bar */}
      <div className="bg-white border-b-2 border-experian-blue/10 sticky top-0 z-40 shadow-sm">
        <div className="h-1 w-full bg-gradient-to-r from-experian-blue via-experian-purple to-experian-magenta"></div>
        <div className="px-6 py-3 flex items-center gap-4">
          <div className="flex items-center gap-3 flex-shrink-0">
            <span className="ex-mark size-md" aria-hidden="true">
              <i className="s1"></i><i className="s2"></i><i className="s3"></i><i className="s4"></i>
            </span>
            <div>
              <h1 className="font-extrabold text-experian-blue text-lg leading-tight tracking-tight">
                Experian <span className="text-experian-purple">Innovation</span>
              </h1>
              <p className="text-[11px] text-slate-500 leading-tight font-medium">
                {state.ideas.length} fikir · {totalNotes} not · {state.stages.length} adım
              </p>
            </div>
          </div>

          <div className="flex-1 max-w-md">
            <div className="relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔍</span>
              <input value={search} onChange={e => setSearch(e.target.value)}
                placeholder="Fikir, etiket veya sorumlu ara…"
                className="w-full pl-9 pr-8 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-300 bg-slate-50 focus:bg-white transition-colors" />
              {search && (
                <button onClick={() => setSearch('')}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-lg">&times;</button>
              )}
            </div>
          </div>

          <div className="ml-auto flex items-center gap-2">
            {role === 'viewer' && (
              <span className="text-xs bg-amber-100 text-amber-700 px-3 py-1.5 rounded-full font-medium">
                👁️ Görüntüleme
              </span>
            )}
            {canEdit && (
              <button onClick={() => setShowTagLib(true)}
                className="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-700 rounded-xl hover:bg-indigo-100 text-sm font-medium">
                🏷️ Tag Ekle
              </button>
            )}
            {canEdit && <ExportMenu state={state} />}
            {canEdit && (
              <button onClick={() => setShowSettings(true)}
                className="flex items-center gap-2 px-4 py-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 text-sm font-medium">
                ⚙️ Ayarlar
              </button>
            )}
            {authCfg?.enabled && (
              <button onClick={() => { clearSession(); setRole('login'); }}
                className="text-xs px-3 py-2 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200">
                Çıkış
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Main */}
      <div className="p-6">
        {search ? (
          <div>
            <h3 className="text-sm font-semibold text-slate-600 mb-4">
              "{search}" için {searchResults.length} sonuç
            </h3>
            {searchResults.length === 0 ? (
              <div className="text-center py-20 text-slate-400">
                <p className="text-5xl mb-3">🔍</p>
                <p>Sonuç bulunamadı</p>
              </div>
            ) : (
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
                {searchResults.map(idea => (
                  <IdeaCard key={idea.id} idea={idea} onOpen={handleOpenIdea} canEdit={canEdit} />
                ))}
              </div>
            )}
          </div>
        ) : (
          <div className="flex gap-4 overflow-x-auto pb-6">
            {state.stages.map(stage => (
              <PipelineColumn
                key={stage.id}
                stage={stage}
                ideas={pipelineIdeas.filter(i => i.stageId === stage.id)}
                onOpen={handleOpenIdea}
                canEdit={canEdit}
                role={role}
                onStageReorder={canEdit ? handleStageReorder : null}
              />
            ))}
            {canEdit && (
              <div
                onClick={() => setShowSettings(true)}
                className="flex-shrink-0 w-[272px] rounded-2xl border-2 border-dashed border-slate-200 flex items-center justify-center cursor-pointer hover:border-indigo-300 hover:bg-indigo-50/50 transition-colors group">
                <div className="text-center text-slate-300 group-hover:text-indigo-400 p-8 transition-colors">
                  <p className="text-3xl mb-2">＋</p>
                  <p className="text-xs font-medium">Adım Ekle</p>
                </div>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Modals */}
      {openIdea && (
        <IdeaDetailModal
          idea={state.ideas.find(i => i.id === openIdea.id) || openIdea}
          onClose={() => setOpenIdea(null)}
          canEdit={canEdit}
        />
      )}
      {showTagLib && (
        <TagLibraryModal onClose={() => setShowTagLib(false)} />
      )}
      {showSettings && (
        <SettingsModal
          onClose={() => setShowSettings(false)}
          onLogout={() => setRole('login')}
        />
      )}
    </Ctx.Provider>
  );
}

// Router — opens the public problem-submission form for either a
// pretty path (/new-idea, /yenifikir, /submit — wired via _redirects)
// or the legacy hash (#submit). Both are standalone, no main-app login.
function isSubmitRoute() {
  const p = (window.location.pathname || '').replace(/\/+$/, '').toLowerCase();
  const h = (window.location.hash     || '').toLowerCase();
  return (
    h === '#submit' || h === '#/submit' ||
    p.endsWith('/new-idea') || p.endsWith('/yenifikir') || p.endsWith('/submit')
  );
}
function Root() {
  const [route, setRoute] = useState(isSubmitRoute() ? 'submit' : 'app');
  useEffect(() => {
    const sync = () => setRoute(isSubmitRoute() ? 'submit' : 'app');
    window.addEventListener('hashchange', sync);
    window.addEventListener('popstate', sync);
    return () => {
      window.removeEventListener('hashchange', sync);
      window.removeEventListener('popstate', sync);
    };
  }, []);
  if (route === 'submit') return <SubmitProblemPage />;
  return <App />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
